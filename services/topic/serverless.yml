# topic.yyt.life — short-lived broadcast topics. HTTP control API on
# `topic{-dev}.yyt.life`, WebSocket on `topic-ws{-dev}.yyt.life` (API Gateway
# cannot map an HTTP API and a WebSocket API onto one custom domain).
service: yyt-topic
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild
  - serverless-domain-manager

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  domainSuffix:
    dev: "-dev"
    prod: ""
  domain: topic${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  wsDomain: topic-ws${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  ssm: /yyt-service/${self:custom.stage}/topic
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  customDomain:
    http:
      domainName: ${self:custom.domain}
      endpointType: regional
      certificateName: yyt.life
      createRoute53Record: true
      autoDomain: true
    websocket:
      domainName: ${self:custom.wsDomain}
      endpointType: regional
      certificateName: yyt.life
      createRoute53Record: true
      autoDomain: true
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  websocketsApiName: ${self:service}-${self:custom.stage}
  # Messages carry `type`; everything still lands on $default (no custom routes).
  websocketsApiRouteSelectionExpression: $request.body.type
  httpApi:
    disableDefaultEndpoint: false
    metrics: true
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}
    REDIS_HOST: ${ssm:${self:custom.ssm}/redis-host}
    REDIS_PORT: ${ssm:${self:custom.ssm}/redis-port}
    REDIS_USER: ${ssm:${self:custom.ssm}/redis-user}
    REDIS_PASSWORD: ${ssm:${self:custom.ssm}/redis-password}
    REDIS_KEY_PREFIX: ${ssm:${self:custom.ssm}/redis-key-prefix}
    # Management API endpoint; connections are posted to via execute-api, not the custom domain.
    WS_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:custom.stage}"
    # Rendered into `wsUrl` of `POST /t`.
    WS_PUBLIC_URL: wss://${self:custom.wsDomain}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${self:custom.stage}/*"

# Connection budget (rules/data.md): every container holds one MySQL + one
# Redis connection. ws 4 + authorizer 3 + http 2 = 9, cut from 12 on
# 2026-08-26 to seat the state stack
# (auth 10 + console 11 + match 18 + topic 9 + state 6 = 54 of the host's 60).
functions:
  authorizer:
    handler: src/handler.authorizer
    reservedConcurrency: 3
  ws:
    handler: src/handler.ws
    reservedConcurrency: 4
    events:
      - websocket:
          route: $connect
          authorizer:
            name: authorizer
            identitySource:
              - route.request.header.Sec-WebSocket-Protocol
      - websocket:
          route: $disconnect
      - websocket:
          route: $default
  http:
    handler: src/handler.http
    reservedConcurrency: 2
    events:
      - httpApi: "*"

package:
  individually: true

resources:
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
    # CloudWatch's free tier is 10 alarms account-wide; see rules/serverless-aws.md.
    IsProd: !Equals ["${self:custom.stage}", "prod"]
  Resources:
    WsErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-ws-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-ws
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    # The authorizer never throws (every failure is a Deny), so infrastructure
    # outages surface only in its logs: count "authorize error" lines.
    AuthorizeErrorMetric:
      Condition: IsProd
      Type: AWS::Logs::MetricFilter
      DependsOn: AuthorizerLogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-authorizer
        FilterPattern: '{ $.m = "authorize error" }'
        MetricTransformations:
          - MetricNamespace: yyt/topic
            MetricName: ${self:custom.stage}-authorize-errors
            MetricValue: "1"
            DefaultValue: 0
    AuthorizeErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-authorize-errors
        Namespace: yyt/topic
        MetricName: ${self:custom.stage}-authorize-errors
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
