# doc.yyt.life — the **doc** storage shape: one versioned JSON document per
# (auth channel, owner), every write conditional on the version it read.
# Modelled on services/auth/serverless.yml; no Redis, no WebSocket, no schema
# of its own — console owns every migration.
service: yyt-state
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild
  - serverless-domain-manager

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  domainSuffix:
    dev: "-dev"
    prod: ""
  # Not `state{-dev}`: that name is already taken by an existing record (see
  # the private ops repo). `doc` also says what the service actually serves.
  domain: doc${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  # Per-service credentials uploaded by scripts/bootstrap-ssm.sh from local/env/*.env.
  ssm: /yyt-service/${self:custom.stage}/state
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    # AWS SDK v3 is already in the runtime; the Prisma client (Rust-free, WASM query compiler inlined) is bundled.
    exclude:
      - "@aws-sdk/*"
    banner:
      # ESM bundles lose `require`; the mariadb driver is CJS, so the shim is required.
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  customDomain:
    domainName: ${self:custom.domain}
    apiType: http
    endpointType: regional
    certificateName: yyt.life
    createRoute53Record: true
    autoDomain: true
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  httpApi:
    disableDefaultEndpoint: false
    metrics: true
    # The stage throttle is NOT set here: `provider.httpApi` has no
    # `defaultRouteSettings` in Serverless 4, which rejects it as an
    # unrecognized property, prints a warning and deploys without it. This
    # stack carried that block from the start and neither stage ever had a
    # ThrottlingRateLimit (measured 2026-09-01, same as console). It lives in
    # `resources.extensions.HttpApiStage` below, which does reach CloudFormation.
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    PUBLIC_BASE_URL: https://${self:custom.domain}
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}

functions:
  api:
    handler: src/handler.handler
    # One MySQL connection per container and no Redis one; the stateful host
    # allows ~60 MySQL connections across every stack, so the reservation is
    # this stack's share of that budget — see the table in rules/data.md.
    reservedConcurrency: 6
    events:
      - httpApi: "*"

package:
  individually: true

resources:
  # Serverless owns AWS::ApiGatewayV2::Stage for the `$default` stage; this
  # patches its properties. `DefaultRouteSettings` is replaced wholesale, so
  # `DetailedMetricsEnabled` (from `httpApi.metrics: true`) is restated here.
  #
  # Resolving *any* bearer costs one MySQL SELECT before a body limit or an
  # authorization check applies, so unauthenticated junk is what actually
  # competes for `reservedConcurrency` — and through it for the shared box's
  # connections. The design ceiling is 10 concurrent players writing a
  # document per dungeon result, so this is far above real use and still
  # keeps a flood from starving them.
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          DetailedMetricsEnabled: true
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
    # CloudWatch's free tier is 10 alarms account-wide; see rules/serverless-aws.md.
    IsProd: !Equals ["${self:custom.stage}", "prod"]
  Resources:
    ApiErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
