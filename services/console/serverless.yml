# console.yyt.life — operator console API (copied from services/auth/serverless.yml).
service: yyt-console
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  domainSuffix:
    dev: "-dev"
    prod: ""
  domain: console${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  # Binary catalog (docs/decisions.md): pre-existing public distribution buckets
  # fronted by the manually managed CDN. Both are outside this stack (surveyed
  # in todo/12); the stack only grants IAM on them.
  artifactBucket:
    dev: yyt-binary-dist-dev
    prod: yyt-binary-dist
  artifactCdn:
    dev: https://dev-d.yyt.life
    prod: https://d.yyt.life
  ssm: /yyt-service/${self:custom.stage}/console
  stageSsm: /yyt-service/${self:custom.stage}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  # The custom domain is served by CloudFront (SPA under /ui, API at the root)
  # so the __Host- session cookie covers both; the HTTP API keeps only its
  # default execute-api endpoint and is reached as a CloudFront origin. The
  # us-east-1 ACM certificate ARN comes from SSM (bootstrap-ssm.sh).
  cloudfrontCertArn: ${ssm:${self:custom.stageSsm}/cloudfront-cert-arn}
  # Managed policy ids (public AWS constants).
  cachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
  cachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
  allViewerExceptHost: b689b0a8-53d0-40ab-baf2-68738e2966ac
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  httpApi:
    disableDefaultEndpoint: false
    metrics: true
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    PUBLIC_BASE_URL: https://${self:custom.domain}
    # SPA base: apps/console-web is served under /ui/ on the same host (CloudFront)
    # so the __Host- session cookie applies.
    WEB_URL: ${param:webUrl, "https://${self:custom.domain}"}/ui
    AUTH_BASE_URL: https://auth${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    TOPIC_BASE_URL: https://topic${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    TOPIC_WS_URL: wss://topic-ws${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    MATCH_BASE_URL: https://match${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    # Self-hosted realtime gateway (Docker on the yyt-stateful box), rendered
    # into `lobby`/`q` channel views. Not an AWS endpoint, so there is no
    # CloudFormation reference to take it from. Empty until the host actually
    # resolves — the views then omit `wsUrl` instead of offering a dead one.
    GATEWAY_WS_URL: ${ssm:${self:custom.stageSsm}/gateway-ws-url, ""}
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}
    REDIS_HOST: ${ssm:${self:custom.ssm}/redis-host}
    REDIS_PORT: ${ssm:${self:custom.ssm}/redis-port}
    REDIS_USER: ${ssm:${self:custom.ssm}/redis-user}
    REDIS_PASSWORD: ${ssm:${self:custom.ssm}/redis-password}
    REDIS_KEY_PREFIX: ${ssm:${self:custom.ssm}/redis-key-prefix}
    # Operator-wide GitHub OAuth app (stage-wide SSM keys, uploaded by bootstrap-ssm.sh).
    GITHUB_CLIENT_ID: ${ssm:${self:custom.stageSsm}/github-client-id}
    GITHUB_CLIENT_SECRET: ${ssm:${self:custom.stageSsm}/github-client-secret}
    ADMIN_GITHUB_LOGINS: ${ssm:${self:custom.stageSsm}/admin-github-logins, ""}
    DEBUG_HOOKS: ${param:debugHooks, "0"}
    DEBUG_KEY: ${ssm:${self:custom.stageSsm}/debug-key, ""}
    # Shared secret the gateway presents on GET /gw/channels/{id}; empty until
    # the gateway ships, and the route answers 503 while it is.
    GATEWAY_TOKEN: ${ssm:${self:custom.stageSsm}/gateway-token, ""}
    POSTER_BUCKET: !Ref PosterBucket
    ARTIFACT_BUCKET: ${self:custom.artifactBucket.${self:custom.stage}}
    ARTIFACT_CDN_URL: ${self:custom.artifactCdn.${self:custom.stage}}
  iam:
    role:
      statements:
        # Posters: presigned PUT/GET are signed with this role, so it needs the
        # object permissions plus KMS for the bucket's SSE-KMS key.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ["", [!GetAtt PosterBucket.Arn, "/posters/*"]]
        # Without ListBucket, HeadObject on a missing key answers 403 instead of 404.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: !GetAtt PosterBucket.Arn
          Condition:
            StringLike:
              s3:prefix: posters/*
        # Binary catalog artifacts and game assets share this bucket: presigned
        # PUT into uploads/ or asset-uploads/, commit copies to the app prefix
        # or assets/{bundle}/{version}/, delete covers cleanup — whole-bucket
        # object CRUD because both key spaces are named by the caller.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.artifactBucket.${self:custom.stage}}/*
        # ListBucket: HeadObject 404s (vs 403) + the uploads/ and
        # asset-uploads/ garbage sweeps.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.artifactBucket.${self:custom.stage}}
        - Effect: Allow
          Action:
            - kms:GenerateDataKey
            - kms:Decrypt
          Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/*
          Condition:
            StringEquals:
              kms:ViaService: s3.${aws:region}.amazonaws.com

functions:
  api:
    handler: src/handler.handler
    # One MySQL + one Redis connection per container; console's share of the
    # host budget is 10 (api) + 1 (expire) — rules/data.md.
    reservedConcurrency: 10
    # Catalog commit copies up to 1GB inside the request; keep headroom under
    # API Gateway's ~29s window. Other routes finish far quicker regardless.
    timeout: 25
    events:
      - httpApi: "*"
  expire:
    handler: src/handler.expire
    reservedConcurrency: 1
    # Also runs the catalog and asset sweeps (S3 deletes across apps).
    timeout: 300
    events:
      # 03:00 KST daily; a fixed time so operators can predict when channels flip.
      - schedule: cron(0 18 * * ? *)

package:
  individually: true

resources:
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
  Resources:
    # Private poster bucket; objects are reached only through presigned URLs
    # (visibility is enforced by the API, so CloudFront does not front it).
    # CORS admits the browser PUT from the SPA.
    PosterBucket:
      Type: AWS::S3::Bucket
      # Posters are durable data: never dropped by a stack removal or replacement.
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: yyt-console-posters-${self:custom.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
              BucketKeyEnabled: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        LifecycleConfiguration:
          Rules:
            - Id: abort-incomplete
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              # webUrl defaults to the API host; listing both would duplicate the
              # origin, which CloudFormation's property validation rejects.
              AllowedOrigins:
                - ${param:webUrl, "https://${self:custom.domain}"}
                - http://localhost:5173
              AllowedHeaders: ["content-type", "content-length"]
              MaxAge: 600

    # --- SPA bucket + CloudFront (todo/07) ---------------------------------
    # Static assets are uploaded under the `ui/` prefix by scripts/deploy-web.sh,
    # so CloudFront paths map 1:1 onto object keys.
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: yyt-console-web-${self:custom.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontOAC
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", [!GetAtt WebBucket.Arn, "/ui/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn:
                    !Join [
                      "",
                      [
                        "arn:aws:cloudfront::${aws:accountId}:distribution/",
                        !Ref WebDistribution,
                      ],
                    ]
    WebOac:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:custom.stage}-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    # SPA fallback: extension-less /ui routes are served index.html. A custom
    # error response (403 -> index) would also swallow real S3 403s, so the
    # rewrite happens before the origin is consulted.
    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:custom.stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Rewrite extension-less /ui routes to /ui/index.html
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var req = event.request;
            var uri = req.uri;
            if (uri === '/ui' || uri === '/ui/') {
              req.uri = '/ui/index.html';
            } else if (uri.indexOf('/ui/') === 0 && uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
              req.uri = '/ui/index.html';
            }
            return req;
          }
    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.domain}
          Aliases:
            - ${self:custom.domain}
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_200
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.cloudfrontCertArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOac.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: api
              DomainName:
                !Join [
                  "",
                  [!Ref HttpApi, ".execute-api.${aws:region}.amazonaws.com"],
                ]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 30
          # API: no caching, every header except Host (API Gateway needs its own
          # Host), all cookies and query strings forwarded.
          DefaultCacheBehavior:
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: ${self:custom.cachingDisabled}
            OriginRequestPolicyId: ${self:custom.allViewerExceptHost}
          CacheBehaviors:
            - PathPattern: /ui
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
            - PathPattern: /ui/*
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
    WebDnsA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneName: yyt.life.
        Name: ${self:custom.domain}
        Type: A
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone id
    WebDnsAAAA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneName: yyt.life.
        Name: ${self:custom.domain}
        Type: AAAA
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
    ApiErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    ExpireErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-expire-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-expire
        Statistic: Sum
        Period: 86400
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-5xx
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value: !Ref HttpApi
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionId:
      Value: !Ref WebDistribution
