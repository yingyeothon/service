# console.yyt.life — operator console API (copied from services/auth/serverless.yml).
service: yyt-console
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  # The gateway liveness probe runs on a schedule only where the gateway is
  # expected to be up around the clock; the dev container is stopped outside
  # test windows and would page every 5 minutes. It also carries the CDN
  # guard's watchdog: pausing it pauses that too.
  gatewayProbeEnabled:
    dev: false
    prod: true
  # CDN cost guard (docs/decisions.md *CDN cost guard and emergency stops*):
  # every stage's distributions are public, dev's included.
  cdnGuardEnabled:
    dev: true
    prod: true
  domainSuffix:
    dev: "-dev"
    prod: ""
  domain: console${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  # Binary catalog (docs/decisions.md): pre-existing public distribution bucket
  # fronted by the manually managed CDN, outside this stack (surveyed in
  # todo/12); the stack only grants IAM on it. The name is an infra identifier
  # (docs/secrets.md), so it comes from SSM like every other one.
  artifactBucket: ${ssm:${self:custom.stageSsm}/artifact-bucket}
  artifactCdn:
    dev: https://dev-d.yyt.life
    prod: https://d.yyt.life
  # Static sites (docs/decisions.md *Static sites*): pre-existing S3 buckets
  # behind hand-made CloudFront distributions, outside this stack like the
  # artifact buckets; the stack only grants IAM on them. Private since
  # 2026-09-27: CloudFront reads them through origin access control
  # (`CdnOriginAccessControl`, scripts/origin-oac.sh). Zips are staged in the
  # private poster bucket, never here.
  siteBucket: ${ssm:${self:custom.stageSsm}/site-bucket}
  siteCdn:
    dev: https://dev-g.yyt.life
    prod: https://g.yyt.life
  # Plain SSM String set by hand (todo/07); empty = no invalidation on this stage.
  siteDistributionId: ${ssm:${self:custom.stageSsm}/site-distribution-id, ""}
  # The artifact CDN's distribution (hand-made, like the path host's): the
  # digest's traffic line and a CDN guard target; empty = neither.
  artifactDistributionId: ${ssm:${self:custom.stageSsm}/cdn-distribution-id, ""}
  # Per-site hosts `{slug}.{suffix}` (docs/decisions.md *Site domains*): a
  # distribution this stack owns, in front of the same bucket. Opt-in per
  # stage: the owner puts the us-east-1 certificate ARN for `*.g.yyt.life` /
  # `*.dev-g.yyt.life` in SSM by hand (rules/deployment.md); empty = none of
  # the SiteHost* resources exist and `hostUrl` is null.
  siteHostCertArn: ${ssm:${self:custom.stageSsm}/site-host-cert-arn, ""}
  siteHostSuffix:
    dev: dev-g.yyt.life
    prod: g.yyt.life
  ssm: /yyt-service/${self:custom.stage}/console
  stageSsm: /yyt-service/${self:custom.stage}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  # The custom domain is served by CloudFront (SPA under /ui, API at the root)
  # so the __Host- session cookie covers both; the HTTP API keeps only its
  # default execute-api endpoint and is reached as a CloudFront origin. The
  # us-east-1 ACM certificate ARN comes from SSM (bootstrap-ssm.sh).
  cloudfrontCertArn: ${ssm:${self:custom.stageSsm}/cloudfront-cert-arn}
  # Managed policy ids (public AWS constants).
  cachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
  cachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
  allViewerExceptHost: b689b0a8-53d0-40ab-baf2-68738e2966ac
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  httpApi:
    disableDefaultEndpoint: false
    metrics: true
    # The stage throttle is NOT set here: `provider.httpApi` has no
    # `defaultRouteSettings` in Serverless 4, which rejects it as an
    # unrecognized property, prints a warning and deploys without it. Measured
    # 2026-09-01: both stages of console AND of state (which carried the same
    # unsupported block) had no ThrottlingRateLimit at all. It lives in
    # `resources.extensions.HttpApiStage` below, which does reach CloudFormation.
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    PUBLIC_BASE_URL: https://${self:custom.domain}
    # SPA base: apps/console-web is served under /ui/ on the same host (CloudFront)
    # so the __Host- session cookie applies.
    WEB_URL: ${param:webUrl, "https://${self:custom.domain}"}/ui
    AUTH_BASE_URL: https://auth${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    TOPIC_BASE_URL: https://topic${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    TOPIC_WS_URL: wss://topic-ws${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    MATCH_BASE_URL: https://match${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    # Self-hosted realtime gateway (Docker on the yyt-stateful box), rendered
    # into `lobby`/`q` channel views. Not an AWS endpoint, so there is no
    # CloudFormation reference to take it from. Empty until the host actually
    # resolves — the views then omit `wsUrl` instead of offering a dead one.
    GATEWAY_WS_URL: ${ssm:${self:custom.stageSsm}/gateway-ws-url, ""}
    # State service base, rendered into `auth` channel views. Written by
    # scripts/bootstrap-ssm.sh only when this stage has a state stack, so an
    # undeployed stage omits `docUrl` rather than advertising a dead endpoint.
    DOC_BASE_URL: ${ssm:${self:custom.stageSsm}/doc-base-url, ""}
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}
    REDIS_HOST: ${ssm:${self:custom.ssm}/redis-host}
    REDIS_PORT: ${ssm:${self:custom.ssm}/redis-port}
    REDIS_USER: ${ssm:${self:custom.ssm}/redis-user}
    REDIS_PASSWORD: ${ssm:${self:custom.ssm}/redis-password}
    REDIS_KEY_PREFIX: ${ssm:${self:custom.ssm}/redis-key-prefix}
    # The Redis account that mints per-channel participant credentials. Empty
    # until the stage has one, and `POST /channels/{id}/redis-user` then answers
    # 503 with `reason: redis_acl_not_configured` rather than a bare failure.
    # It can create and delete Redis users, so it is deliberately a second
    # account: the console's own user keeps `-@dangerous` and no ACL rights.
    REDIS_ACL_USER: ${ssm:${self:custom.ssm}/redis-acl-user, ""}
    REDIS_ACL_PASSWORD: ${ssm:${self:custom.ssm}/redis-acl-password, ""}
    # Operator-wide GitHub OAuth app (stage-wide SSM keys, uploaded by bootstrap-ssm.sh).
    GITHUB_CLIENT_ID: ${ssm:${self:custom.stageSsm}/github-client-id}
    GITHUB_CLIENT_SECRET: ${ssm:${self:custom.stageSsm}/github-client-secret}
    ADMIN_GITHUB_LOGINS: ${ssm:${self:custom.stageSsm}/admin-github-logins, ""}
    DEBUG_HOOKS: ${param:debugHooks, "0"}
    DEBUG_KEY: ${ssm:${self:custom.stageSsm}/debug-key, ""}
    # Shared secret the gateway presents on GET /gw/channels/{id}; empty until
    # the gateway ships, and the route answers 503 while it is.
    GATEWAY_TOKEN: ${ssm:${self:custom.stageSsm}/gateway-token, ""}
    # Where the gateway probe publishes its down/recovered edges (no CloudWatch
    # alarm involved). Empty means the probe logs and notifies nobody.
    ALARM_TOPIC_ARN: ${self:custom.alarmTopic}
    POSTER_BUCKET: !Ref PosterBucket
    ARTIFACT_BUCKET: ${self:custom.artifactBucket}
    ARTIFACT_CDN_URL: ${self:custom.artifactCdn.${self:custom.stage}}
    # CloudFront distribution id of ARTIFACT_CDN_URL, for the daily usage
    # digest and the CDN guard; plain SSM String set by hand, empty = neither.
    ARTIFACT_CDN_DISTRIBUTION_ID: ${self:custom.artifactDistributionId}
    SITE_BUCKET: ${self:custom.siteBucket}
    SITE_CDN_URL: ${self:custom.siteCdn.${self:custom.stage}}
    # CloudFront distribution id of SITE_CDN_URL, invalidated after every site
    # deploy; plain SSM String set by hand, empty = deploys go live without
    # invalidation (the edge serves the old tree for up to its TTL).
    SITE_CDN_DISTRIBUTION_ID: ${self:custom.siteDistributionId}
    # The worker `api` invokes asynchronously on commit.
    SITE_DEPLOY_FUNCTION: ${self:service}-${self:custom.stage}-siteDeploy
    # `{slug}.{suffix}` host of every site, only where the distribution exists.
    SITE_HOST_SUFFIX: !If
      - HasSiteHost
      - ${self:custom.siteHostSuffix.${self:custom.stage}}
      - ""
    # A reference to the wildcard record: CloudFormation then updates the
    # functions only after the record exists, so no API answers a `hostUrl`
    # the DNS cannot resolve yet (and resolvers would cache the miss).
    SITE_HOST_RECORD: !If [HasSiteHost, !Ref SiteHostDnsA, ""]
  iam:
    role:
      statements:
        # Posters: presigned PUT/GET are signed with this role, so it needs the
        # object permissions plus KMS for the bucket's SSE-KMS key.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ["", [!GetAtt PosterBucket.Arn, "/posters/*"]]
        # Without ListBucket, HeadObject on a missing key answers 403 instead of 404.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: !GetAtt PosterBucket.Arn
          Condition:
            StringLike:
              s3:prefix:
                - posters/*
                - site-uploads/*
                # The show sweep lists this prefix and deletes what nothing
                # references; without it the list is denied, not empty.
                - shots/*
        # Site zips are staged in the same private bucket (presigned PUT,
        # read once by the worker, deleted after).
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ["", [!GetAtt PosterBucket.Arn, "/site-uploads/*"]]
        # Show screenshots: same bucket, its own prefix. A separate statement
        # because each object statement pins a single `!Join` Resource.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ["", [!GetAtt PosterBucket.Arn, "/shots/*"]]
        # Site bucket: the worker writes `{slug}/…`, prunes, and copies a whole
        # prefix for a move (CopyObject = Get on the source + Put on the
        # target); the api lists a prefix before minting a slug or claiming a
        # name and wipes it on delete; the sweeps purge released prefixes.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.siteBucket}/*
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.siteBucket}
        # `/{slug}/*` after a deploy or a delete: only the stage's own site
        # distribution, and no statement at all while none is configured.
        - !If
          - HasSiteDistribution
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: arn:aws:cloudfront::${aws:accountId}:distribution/${self:custom.siteDistributionId}
          - !Ref AWS::NoValue
        # commit → async invoke of the worker (this stack's own function).
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-siteDeploy
        # Binary catalog artifacts and game assets share this bucket: presigned
        # PUT into uploads/ or asset-uploads/, commit copies to the app prefix
        # or assets/{bundle}/{version}/, delete covers cleanup — whole-bucket
        # object CRUD because both key spaces are named by the caller.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.artifactBucket}/*
        # ListBucket: HeadObject 404s (vs 403) + the uploads/ and
        # asset-uploads/ garbage sweeps.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.artifactBucket}
        - Effect: Allow
          Action:
            - kms:GenerateDataKey
            - kms:Decrypt
          Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/*
          Condition:
            StringEquals:
              kms:ViaService: s3.${aws:region}.amazonaws.com
        # Daily usage digest reads the S3 storage and CloudFront traffic
        # metrics (reads only; no new alarm — 10-alarm free-tier cap).
        - Effect: Allow
          Action: cloudwatch:GetMetricStatistics
          Resource: "*"
        # Gateway probe and usage digest → the stage's alarm topic. The topic
        # is created by scripts/bootstrap-alarms.sh, so only its ARN is known here.
        - !If
          - HasAlarmTopic
          - Effect: Allow
            Action: sns:Publish
            Resource: ${self:custom.alarmTopic}
          - !Ref AWS::NoValue

functions:
  api:
    handler: src/handler.handler
    # One MySQL + one Redis connection per container; console's share of the
    # host budget is 10 (api) + 1 (expire) — rules/data.md.
    reservedConcurrency: 10
    # Memory buys CPU for the invoke phase; the Prisma query compiler is
    # CPU-bound (measured sizes and costs: rules/serverless-aws.md).
    memorySize: 1024
    # Catalog commit copies up to 1GB inside the request; keep headroom under
    # API Gateway's ~29s window. Other routes finish far quicker regardless.
    timeout: 25
    events:
      - httpApi: "*"
  expire:
    handler: src/handler.expire
    reservedConcurrency: 1
    # Also runs the catalog and asset sweeps (S3 deletes across apps).
    timeout: 300
    # The digest's traffic lines for this stack's own two distributions. Set
    # here, not on the provider, so `api` does not depend on them.
    environment:
      SITE_HOST_DISTRIBUTION_ID:
        !If [HasSiteHost, !Ref SiteHostDistribution, ""]
      WEB_DISTRIBUTION_ID: !Ref WebDistribution
    events:
      # 03:00 KST daily; a fixed time so operators can predict when channels flip.
      - schedule: cron(0 18 * * ? *)

  siteDeploy:
    handler: src/handler.siteDeploy
    # One deploy at a time (the api serialises per site anyway); holds one
    # MariaDB connection — counted in the budget table (rules/data.md).
    reservedConcurrency: 1
    # Inflates up to 50 MB and PUTs up to 2000 objects.
    memorySize: 512
    timeout: 300
    # Every path ends in a status write; a retry could only repeat a failure.
    maximumRetryAttempts: 0

  gatewayProbe:
    handler: src/handler.gatewayProbe
    reservedConcurrency: 1
    memorySize: 128
    timeout: 20
    events:
      # docs/decisions.md *Realtime gateway* → Monitoring: GET /livez on the
      # self-hosted gateway, SNS on the down/recovered edge only. A 5-minute
      # blind spot is accepted; the alternative was an 11th CloudWatch alarm.
      - schedule:
          rate: rate(5 minutes)
          enabled: ${self:custom.gatewayProbeEnabled.${self:custom.stage}, false}

  cdnGuard:
    handler: src/handler.cdnGuard
    # Redis only, no MariaDB: outside the connection budget (rules/data.md).
    reservedConcurrency: 1
    # A normal run takes a few seconds; the rest is room for slow CloudFront
    # and CloudWatch calls (each bounded at 5 s, two attempts), billed only if used.
    timeout: 120
    # The next tick is 5 minutes away; a retry would only overlap it.
    maximumRetryAttempts: 0
    environment:
      SITE_HOST_DISTRIBUTION_ID:
        !If [HasSiteHost, !Ref SiteHostDistribution, ""]
      WEB_DISTRIBUTION_ID: !Ref WebDistribution
      # alert (default) | off; the console distribution is never disabled.
      CDN_GUARD_CONSOLE: ${param:cdnGuardConsole, "alert"}
      # enforce (default) | alert: `alert` announces trips and disables nothing
      # (a contest day that expects a spike); scale multiplies every threshold.
      CDN_GUARD_MODE: ${param:cdnGuardMode, "enforce"}
      CDN_GUARD_SCALE: ${param:cdnGuardScale, "1"}
      # The guard needs none of the provider's secrets.
      MYSQL_PASSWORD: ""
      REDIS_ACL_USER: ""
      REDIS_ACL_PASSWORD: ""
      GITHUB_CLIENT_SECRET: ""
      DEBUG_KEY: ""
      GATEWAY_TOKEN: ""
    # Its own role (`CdnGuardRole` below): the only one in the stack allowed
    # to update a distribution, and only the three it may disable.
    role: CdnGuardRole
    events:
      # docs/decisions.md *CDN cost guard and emergency stops*: disables a
      # public distribution past a trip threshold; SNS on edges only. No
      # CloudWatch alarm, and no Errors alarm on it either (10-alarm cap):
      # the usage digest checks its last run.
      - schedule:
          rate: rate(5 minutes)
          enabled: ${self:custom.cdnGuardEnabled.${self:custom.stage}, false}

package:
  individually: true

resources:
  # Serverless owns AWS::ApiGatewayV2::Stage for the `$default` stage; this
  # patches its properties. `DefaultRouteSettings` is replaced wholesale, so
  # `DetailedMetricsEnabled` (from `httpApi.metrics: true`) is restated here.
  #
  # `api` is one function behind every console route at
  # `reservedConcurrency: 10`, so `connectionLimit: 1` already caps its share
  # of the host's MySQL connections — but nothing stopped an anonymous flood
  # of the show routes from throttling sign-in, the SPA and the CLI with it.
  # The show gallery is the first anonymous, uncached, multi-query route
  # family here (`todo/24-show.md`), which is what makes this worth having.
  # Well above real organiser traffic.
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          DetailedMetricsEnabled: true
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
    HasArtifactDistribution:
      !Not [!Equals ["${self:custom.artifactDistributionId}", ""]]
    HasSiteDistribution:
      !Not [!Equals ["${self:custom.siteDistributionId}", ""]]
    HasSiteHost: !Not [!Equals ["${self:custom.siteHostCertArn}", ""]]
    # CloudWatch's free tier is 10 alarms account-wide; see rules/serverless-aws.md.
    IsProd: !Equals ["${self:custom.stage}", "prod"]
  Resources:
    # Private poster bucket; objects are reached only through presigned URLs
    # (visibility is enforced by the API, so CloudFront does not front it).
    # CORS admits the browser PUT from the SPA.
    PosterBucket:
      Type: AWS::S3::Bucket
      # Posters are durable data: never dropped by a stack removal or replacement.
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: yyt-console-posters-${self:custom.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
              BucketKeyEnabled: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        LifecycleConfiguration:
          Rules:
            - Id: abort-incomplete
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              # webUrl defaults to the API host; listing both would duplicate the
              # origin, which CloudFormation's property validation rejects.
              AllowedOrigins:
                - ${param:webUrl, "https://${self:custom.domain}"}
                - http://localhost:5173
              AllowedHeaders: ["content-type", "content-length"]
              MaxAge: 600

    # --- SPA bucket + CloudFront (todo/07) ---------------------------------
    # Static assets are uploaded under the `ui/` prefix by scripts/deploy-web.sh,
    # so CloudFront paths map 1:1 onto object keys.
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: yyt-console-web-${self:custom.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontOAC
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", [!GetAtt WebBucket.Arn, "/ui/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn:
                    !Join [
                      "",
                      [
                        "arn:aws:cloudfront::${aws:accountId}:distribution/",
                        !Ref WebDistribution,
                      ],
                    ]
    WebOac:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:custom.stage}-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    # SPA fallback: extension-less /ui routes are served index.html. A custom
    # error response (403 -> index) would also swallow real S3 403s, so the
    # rewrite happens before the origin is consulted.
    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:custom.stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Redirect / to /ui/; rewrite extension-less /ui routes to /ui/index.html
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var req = event.request;
            var uri = req.uri;
            if (uri === '/') {
              return {
                statusCode: 302,
                statusDescription: 'Found',
                headers: { location: { value: '/ui/' } }
              };
            }
            if (uri === '/ui' || uri === '/ui/') {
              req.uri = '/ui/index.html';
            } else if (uri.indexOf('/ui/') === 0 && uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
              req.uri = '/ui/index.html';
            }
            return req;
          }
    # Response headers for everything the web origin serves (the SPA and the
    # "/" redirect). The CSP is what makes the markdown renderer's sanitizer a
    # second line rather than the only one: no inline or remote scripts, no
    # frames, uploads only to S3 (presigned PUT) and the API on this origin.
    # `style-src 'unsafe-inline'` is required by Mantine's inline style
    # attributes and its CSS-variables <style> element. `img-src` needs the S3
    # host because `GET /events/{id}/poster` answers a 302 to a presigned URL
    # and the browser checks the redirect target against the policy too (the
    # exact virtual-hosted bucket URL the presigner emits, not a wildcard).
    WebHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${self:custom.stage}-web-headers
          SecurityHeadersConfig:
            ContentSecurityPolicy:
              Override: true
              ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://yyt-console-posters-${self:custom.stage}.s3.ap-northeast-2.amazonaws.com; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
            ContentTypeOptions:
              Override: true
            FrameOptions:
              Override: true
              FrameOption: DENY
            ReferrerPolicy:
              Override: true
              ReferrerPolicy: strict-origin-when-cross-origin
            StrictTransportSecurity:
              Override: true
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: false
    # The API behavior gets the transport headers only: no CSP (JSON is never a
    # document), but HSTS and nosniff reach clients that never load the SPA.
    ApiHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${self:custom.stage}-api-headers
          SecurityHeadersConfig:
            ContentTypeOptions:
              Override: true
            StrictTransportSecurity:
              Override: true
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: false
    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.domain}
          Aliases:
            - ${self:custom.domain}
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_200
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.cloudfrontCertArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOac.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: api
              DomainName:
                !Join [
                  "",
                  [!Ref HttpApi, ".execute-api.${aws:region}.amazonaws.com"],
                ]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 30
          # API: no caching, every header except Host (API Gateway needs its own
          # Host), all cookies and query strings forwarded.
          DefaultCacheBehavior:
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: ${self:custom.cachingDisabled}
            OriginRequestPolicyId: ${self:custom.allViewerExceptHost}
            ResponseHeadersPolicyId: !Ref ApiHeadersPolicy
          CacheBehaviors:
            # Exact "/" only: the function answers 302 -> /ui/ at the edge, so
            # the origin is never reached. API paths keep the default behavior.
            - PathPattern: /
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              ResponseHeadersPolicyId: !Ref WebHeadersPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
            - PathPattern: /ui
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              ResponseHeadersPolicyId: !Ref WebHeadersPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
            - PathPattern: /ui/*
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              ResponseHeadersPolicyId: !Ref WebHeadersPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
    # Private origins (docs/decisions.md *CDN cost guard* §11): one origin
    # access control per stage for the S3 REST origins of the site and
    # artifact buckets. The per-site host uses it here; scripts/origin-oac.sh
    # attaches it to the hand-made path host and artifact CDN, which exist on
    # every stage, so it is unconditional. The bucket policies name the
    # distributions, not this control.
    CdnOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:custom.stage}-cdn-origin
          Description: Site and artifact buckets behind CloudFront
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    # The hand-made path host (`g.yyt.life/{slug}/…`) over the site bucket's
    # REST endpoint, attached by scripts/origin-oac.sh: only what the website
    # endpoint did that clients rely on. `/{slug}` redirects to `/{slug}/`, or
    # the relative URLs of its index.html break; only a segment in the prefix
    # grammar (slugs, names, legacy prefixes: `[a-z0-9-]`, no top-level files
    # in the bucket) is redirected, so a Location can never hold `\`, `%` or
    # another host; a path ending in `/` gets `index.html`; a literal `+` is
    # sent as `%2B`, since the REST endpoint reads it as a space and the
    # website endpoint read it as `+`. The query string only goes into that
    # Location, never to S3: a signed request honours `response-content-type`
    # and the other response overrides. Nothing is refused: legacy prefixes
    # are served as they are. No `${…}` in the code: Serverless would resolve it.
    PathHostRequestFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:custom.stage}-path-host
        AutoPublish: true
        FunctionConfig:
          Comment: Path host over the site bucket's REST endpoint
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          var ROOT = /^\/[a-z0-9][a-z0-9-]*$/;
          function query(q) {
            var parts = [];
            for (var name in q) {
              var v = q[name];
              var list = v.multiValue ? v.multiValue : [v];
              for (var i = 0; i < list.length; i++)
                parts.push(list[i].value === '' ? name : name + '=' + list[i].value);
            }
            return parts.length ? '?' + parts.join('&') : '';
          }
          function handler(event) {
            var req = event.request;
            var uri = req.uri;
            if (ROOT.test(uri)) {
              return {
                statusCode: 302,
                statusDescription: 'Found',
                headers: { location: { value: uri + '/' + query(req.querystring) } }
              };
            }
            if (uri.charAt(uri.length - 1) === '/') uri += 'index.html';
            req.uri = uri.replace(/\+/g, '%2B');
            req.querystring = {};
            return req;
          }
    # The hand-made artifact CDN over its bucket's REST endpoint, attached by
    # scripts/origin-oac.sh: a literal `+` (build metadata in an APK name) is
    # sent as `%2B` and the query string is dropped, as on the path host, and
    # `/` asks for `/index.html`, since `GET /` on the REST endpoint is a
    # bucket listing.
    ArtifactRequestFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:custom.stage}-artifact-cdn
        AutoPublish: true
        FunctionConfig:
          Comment: Artifact CDN over the artifact bucket's REST endpoint
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var req = event.request;
            req.uri = req.uri === '/' ? '/index.html' : req.uri.replace(/\+/g, '%2B');
            req.querystring = {};
            return req;
          }
    # Per-site hosts (docs/decisions.md *Site domains*). A site's slug is its
    # S3 prefix and its host label, so the edge needs no lookup: the function
    # checks the Host against the name grammar (`site-domains.ts` SITE_NAME,
    # pinned by test/site-host-edge.test.ts) and prefixes the path; a path
    # outside the zip grammar (`zip.ts` SEGMENT: no `%`, no dot segments, no
    # `//`) cannot name a site object and is refused. Origin is
    # the bucket's REST endpoint, not the website one, so no ErrorDocument and
    # no directory redirects apply; `/` gets `index.html`. The edge TTL is
    # capped at 300 s and nothing here is ever invalidated. Anything that fails
    # a check is a 404 from the function (fail closed, never passed through).
    # The function and both policies exist on every stage (free while nothing
    # uses them), so `aws cloudfront test-function` can exercise the real
    # runtime before any certificate or distribution exists.
    SiteHostRequestFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:custom.stage}-site-host
        AutoPublish: true
        FunctionConfig:
          Comment: Map a per-site host to its prefix in the site bucket
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          var SUFFIX = '.${self:custom.siteHostSuffix.${self:custom.stage}}';
          var LABEL = /^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$/;
          var PATH = /^\/[A-Za-z0-9._@~+=()\[\]\/-]*$/;
          var BAD = /\/\/|\/\.\.?(\/|$)/;
          function notFound() {
            return {
              statusCode: 404,
              statusDescription: 'Not Found',
              headers: {
                'cache-control': { value: 'no-store' },
                'x-content-type-options': { value: 'nosniff' }
              }
            };
          }
          function handler(event) {
            var req = event.request;
            var host = req.headers.host ? req.headers.host.value.toLowerCase() : '';
            if (host.length <= SUFFIX.length || host.slice(-SUFFIX.length) !== SUFFIX) return notFound();
            var label = host.slice(0, host.length - SUFFIX.length);
            if (!LABEL.test(label) || label.indexOf('--') !== -1) return notFound();
            // Escapes a URL encoder may emit for characters site keys can
            // hold decode first; every other `%` (`%2F`, `%2E`, `%25`, …) is
            // refused below with the rest of the grammar.
            var uri = req.uri.replace(/%(40|3D|2B|5B|5D|28|29|7E)/gi, function (m) {
              return decodeURIComponent(m);
            });
            if (!PATH.test(uri) || BAD.test(uri)) return notFound();
            if (uri.charAt(uri.length - 1) === '/') uri += 'index.html';
            req.uri = '/' + label + uri.replace(/\+/g, '%2B');
            return req;
          }
    # MinTTL 0 so `no-cache` HTML revalidates; MaxTTL 300 bounds how long a
    # deploy, move or delete takes to show without an invalidation. The query
    # string stays out of the key, like the hand-made path host.
    SiteHostCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-${self:custom.stage}-site-host
          Comment: Per-site hosts; edge TTL at most 300 s, never invalidated
          MinTTL: 0
          DefaultTTL: 60
          MaxTTL: 300
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true
            HeadersConfig:
              HeaderBehavior: none
            CookiesConfig:
              CookieBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none
    # The path host's headers (nosniff + HSTS, no frame options: games embed)
    # plus Origin-Agent-Cluster, since every site now has an origin to isolate.
    SiteHostHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${self:custom.stage}-site-host-headers
          SecurityHeadersConfig:
            ContentTypeOptions:
              Override: true
            StrictTransportSecurity:
              Override: true
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: false
          CustomHeadersConfig:
            Items:
              - Header: Origin-Agent-Cluster
                Value: "?1"
                Override: true
    SiteHostDistribution:
      Type: AWS::CloudFront::Distribution
      Condition: HasSiteHost
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: Per-site hosts of ${self:custom.siteHostSuffix.${self:custom.stage}}
          Aliases:
            - "*.${self:custom.siteHostSuffix.${self:custom.stage}}"
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_200
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.siteHostCertArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            # Read through origin access control: the site bucket's policy
            # lets this distribution in (scripts/origin-oac.sh, before the
            # deploy that creates or switches it; deploy.sh checks). A
            # missing key is the REST endpoint's 403.
            - Id: site
              DomainName: ${self:custom.siteBucket}.s3.${aws:region}.amazonaws.com
              OriginAccessControlId: !GetAtt CdnOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
          DefaultCacheBehavior:
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SiteHostCachePolicy
            ResponseHeadersPolicyId: !Ref SiteHostHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SiteHostRequestFunction.FunctionARN
    SiteHostDnsA:
      Type: AWS::Route53::RecordSet
      Condition: HasSiteHost
      Properties:
        HostedZoneName: yyt.life.
        Name: "*.${self:custom.siteHostSuffix.${self:custom.stage}}"
        Type: A
        AliasTarget:
          DNSName: !GetAtt SiteHostDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
    SiteHostDnsAAAA:
      Type: AWS::Route53::RecordSet
      Condition: HasSiteHost
      Properties:
        HostedZoneName: yyt.life.
        Name: "*.${self:custom.siteHostSuffix.${self:custom.stage}}"
        Type: AAAA
        AliasTarget:
          DNSName: !GetAtt SiteHostDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
    WebDnsA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneName: yyt.life.
        Name: ${self:custom.domain}
        Type: A
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone id
    WebDnsAAAA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneName: yyt.life.
        Name: ${self:custom.domain}
        Type: AAAA
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
    ApiErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    ExpireErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-expire-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-expire
        Statistic: Sum
        Period: 86400
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    # The CDN guard's role, written out rather than generated per function:
    # Serverless's per-function roles refuse conditional statements, and every
    # statement here depends on a pointer a stage may not have. Nothing else
    # in the stack can switch a distribution off, and the console's own
    # distribution (alert-only) is not in it.
    CdnGuardRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: cdn-guard
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${self:custom.stage}-cdnGuard:*
                - Effect: Allow
                  Action: cloudwatch:GetMetricStatistics
                  Resource: "*"
                - !If
                  - HasAlarmTopic
                  - Effect: Allow
                    Action: sns:Publish
                    Resource: ${self:custom.alarmTopic}
                  - !Ref AWS::NoValue
                - !If
                  - HasArtifactDistribution
                  - Effect: Allow
                    Action:
                      - cloudfront:GetDistribution
                      - cloudfront:GetDistributionConfig
                      - cloudfront:UpdateDistribution
                    Resource: arn:aws:cloudfront::${aws:accountId}:distribution/${self:custom.artifactDistributionId}
                  - !Ref AWS::NoValue
                - !If
                  - HasSiteDistribution
                  - Effect: Allow
                    Action:
                      - cloudfront:GetDistribution
                      - cloudfront:GetDistributionConfig
                      - cloudfront:UpdateDistribution
                    Resource: arn:aws:cloudfront::${aws:accountId}:distribution/${self:custom.siteDistributionId}
                  - !Ref AWS::NoValue
                - !If
                  - HasSiteHost
                  - Effect: Allow
                    Action:
                      - cloudfront:GetDistribution
                      - cloudfront:GetDistributionConfig
                      - cloudfront:UpdateDistribution
                    Resource: !Join
                      - ""
                      - - arn:aws:cloudfront::${aws:accountId}:distribution/
                        - !Ref SiteHostDistribution
                  - !Ref AWS::NoValue
                # Belt and braces: an SSM id that pointed at the console's own
                # distribution must still not let the guard change it.
                - Effect: Deny
                  Action: cloudfront:UpdateDistribution
                  Resource: !Join
                    - ""
                    - - arn:aws:cloudfront::${aws:accountId}:distribution/
                      - !Ref WebDistribution
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionId:
      Value: !Ref WebDistribution
