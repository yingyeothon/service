# console.yyt.life — operator console API (copied from services/auth/serverless.yml).
service: yyt-console
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  # The gateway liveness probe runs on a schedule only where the gateway is
  # expected to be up around the clock; the dev container is stopped outside
  # test windows and would page every 5 minutes.
  gatewayProbeEnabled:
    dev: false
    prod: true
  domainSuffix:
    dev: "-dev"
    prod: ""
  domain: console${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  # Binary catalog (docs/decisions.md): pre-existing public distribution bucket
  # fronted by the manually managed CDN, outside this stack (surveyed in
  # todo/12); the stack only grants IAM on it. The name is an infra identifier
  # (docs/secrets.md), so it comes from SSM like every other one.
  artifactBucket: ${ssm:${self:custom.stageSsm}/artifact-bucket}
  artifactCdn:
    dev: https://dev-d.yyt.life
    prod: https://d.yyt.life
  # Static sites (docs/decisions.md *Static sites*): pre-existing public S3
  # website buckets behind hand-made CloudFront distributions, outside this
  # stack like the artifact buckets; the stack only grants IAM on them. Zips
  # are staged in the private poster bucket, never here.
  siteBucket: ${ssm:${self:custom.stageSsm}/site-bucket}
  siteCdn:
    dev: https://dev-g.yyt.life
    prod: https://g.yyt.life
  # Plain SSM String set by hand (todo/07); empty = no invalidation on this stage.
  siteDistributionId: ${ssm:${self:custom.stageSsm}/site-distribution-id, ""}
  ssm: /yyt-service/${self:custom.stage}/console
  stageSsm: /yyt-service/${self:custom.stage}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  # The custom domain is served by CloudFront (SPA under /ui, API at the root)
  # so the __Host- session cookie covers both; the HTTP API keeps only its
  # default execute-api endpoint and is reached as a CloudFront origin. The
  # us-east-1 ACM certificate ARN comes from SSM (bootstrap-ssm.sh).
  cloudfrontCertArn: ${ssm:${self:custom.stageSsm}/cloudfront-cert-arn}
  # Managed policy ids (public AWS constants).
  cachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
  cachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
  allViewerExceptHost: b689b0a8-53d0-40ab-baf2-68738e2966ac
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  httpApi:
    disableDefaultEndpoint: false
    metrics: true
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    PUBLIC_BASE_URL: https://${self:custom.domain}
    # SPA base: apps/console-web is served under /ui/ on the same host (CloudFront)
    # so the __Host- session cookie applies.
    WEB_URL: ${param:webUrl, "https://${self:custom.domain}"}/ui
    AUTH_BASE_URL: https://auth${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    TOPIC_BASE_URL: https://topic${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    TOPIC_WS_URL: wss://topic-ws${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    MATCH_BASE_URL: https://match${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
    # Self-hosted realtime gateway (Docker on the yyt-stateful box), rendered
    # into `lobby`/`q` channel views. Not an AWS endpoint, so there is no
    # CloudFormation reference to take it from. Empty until the host actually
    # resolves — the views then omit `wsUrl` instead of offering a dead one.
    GATEWAY_WS_URL: ${ssm:${self:custom.stageSsm}/gateway-ws-url, ""}
    # State service base, rendered into `auth` channel views. Written by
    # scripts/bootstrap-ssm.sh only when this stage has a state stack, so an
    # undeployed stage omits `docUrl` rather than advertising a dead endpoint.
    DOC_BASE_URL: ${ssm:${self:custom.stageSsm}/doc-base-url, ""}
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}
    REDIS_HOST: ${ssm:${self:custom.ssm}/redis-host}
    REDIS_PORT: ${ssm:${self:custom.ssm}/redis-port}
    REDIS_USER: ${ssm:${self:custom.ssm}/redis-user}
    REDIS_PASSWORD: ${ssm:${self:custom.ssm}/redis-password}
    REDIS_KEY_PREFIX: ${ssm:${self:custom.ssm}/redis-key-prefix}
    # The Redis account that mints per-channel participant credentials. Empty
    # until the stage has one, and `POST /channels/{id}/redis-user` then answers
    # 503 with `reason: redis_acl_not_configured` rather than a bare failure.
    # It can create and delete Redis users, so it is deliberately a second
    # account: the console's own user keeps `-@dangerous` and no ACL rights.
    REDIS_ACL_USER: ${ssm:${self:custom.ssm}/redis-acl-user, ""}
    REDIS_ACL_PASSWORD: ${ssm:${self:custom.ssm}/redis-acl-password, ""}
    # Operator-wide GitHub OAuth app (stage-wide SSM keys, uploaded by bootstrap-ssm.sh).
    GITHUB_CLIENT_ID: ${ssm:${self:custom.stageSsm}/github-client-id}
    GITHUB_CLIENT_SECRET: ${ssm:${self:custom.stageSsm}/github-client-secret}
    ADMIN_GITHUB_LOGINS: ${ssm:${self:custom.stageSsm}/admin-github-logins, ""}
    DEBUG_HOOKS: ${param:debugHooks, "0"}
    DEBUG_KEY: ${ssm:${self:custom.stageSsm}/debug-key, ""}
    # Shared secret the gateway presents on GET /gw/channels/{id}; empty until
    # the gateway ships, and the route answers 503 while it is.
    GATEWAY_TOKEN: ${ssm:${self:custom.stageSsm}/gateway-token, ""}
    # Where the gateway probe publishes its down/recovered edges (no CloudWatch
    # alarm involved). Empty means the probe logs and notifies nobody.
    ALARM_TOPIC_ARN: ${self:custom.alarmTopic}
    POSTER_BUCKET: !Ref PosterBucket
    ARTIFACT_BUCKET: ${self:custom.artifactBucket}
    ARTIFACT_CDN_URL: ${self:custom.artifactCdn.${self:custom.stage}}
    # CloudFront distribution id of ARTIFACT_CDN_URL, for the daily usage
    # digest's traffic metric; plain SSM String set by hand, empty = no CDN metric.
    ARTIFACT_CDN_DISTRIBUTION_ID: ${ssm:${self:custom.stageSsm}/cdn-distribution-id, ""}
    SITE_BUCKET: ${self:custom.siteBucket}
    SITE_CDN_URL: ${self:custom.siteCdn.${self:custom.stage}}
    # CloudFront distribution id of SITE_CDN_URL, invalidated after every site
    # deploy; plain SSM String set by hand, empty = deploys go live without
    # invalidation (the edge serves the old tree for up to its TTL).
    SITE_CDN_DISTRIBUTION_ID: ${self:custom.siteDistributionId}
    # The worker `api` invokes asynchronously on commit.
    SITE_DEPLOY_FUNCTION: ${self:service}-${self:custom.stage}-siteDeploy
  iam:
    role:
      statements:
        # Posters: presigned PUT/GET are signed with this role, so it needs the
        # object permissions plus KMS for the bucket's SSE-KMS key.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ["", [!GetAtt PosterBucket.Arn, "/posters/*"]]
        # Without ListBucket, HeadObject on a missing key answers 403 instead of 404.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: !GetAtt PosterBucket.Arn
          Condition:
            StringLike:
              s3:prefix:
                - posters/*
                - site-uploads/*
        # Site zips are staged in the same private bucket (presigned PUT,
        # read once by the worker, deleted after).
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ["", [!GetAtt PosterBucket.Arn, "/site-uploads/*"]]
        # Site bucket: the worker writes `{slug}/…` and prunes; the api lists
        # a prefix before minting a slug and wipes it on delete.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.siteBucket}/*
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.siteBucket}
        # `/{slug}/*` after a deploy or a delete: only the stage's own site
        # distribution, and no statement at all while none is configured.
        - !If
          - HasSiteDistribution
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: arn:aws:cloudfront::${aws:accountId}:distribution/${self:custom.siteDistributionId}
          - !Ref AWS::NoValue
        # commit → async invoke of the worker (this stack's own function).
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:custom.stage}-siteDeploy
        # Binary catalog artifacts and game assets share this bucket: presigned
        # PUT into uploads/ or asset-uploads/, commit copies to the app prefix
        # or assets/{bundle}/{version}/, delete covers cleanup — whole-bucket
        # object CRUD because both key spaces are named by the caller.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.artifactBucket}/*
        # ListBucket: HeadObject 404s (vs 403) + the uploads/ and
        # asset-uploads/ garbage sweeps.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.artifactBucket}
        - Effect: Allow
          Action:
            - kms:GenerateDataKey
            - kms:Decrypt
          Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/*
          Condition:
            StringEquals:
              kms:ViaService: s3.${aws:region}.amazonaws.com
        # Daily usage digest reads the S3 storage and CloudFront traffic
        # metrics (reads only; no new alarm — 10-alarm free-tier cap).
        - Effect: Allow
          Action: cloudwatch:GetMetricStatistics
          Resource: "*"
        # Gateway probe and usage digest → the stage's alarm topic. The topic
        # is created by scripts/bootstrap-alarms.sh, so only its ARN is known here.
        - !If
          - HasAlarmTopic
          - Effect: Allow
            Action: sns:Publish
            Resource: ${self:custom.alarmTopic}
          - !Ref AWS::NoValue

functions:
  api:
    handler: src/handler.handler
    # One MySQL + one Redis connection per container; console's share of the
    # host budget is 10 (api) + 1 (expire) — rules/data.md.
    reservedConcurrency: 10
    # Catalog commit copies up to 1GB inside the request; keep headroom under
    # API Gateway's ~29s window. Other routes finish far quicker regardless.
    timeout: 25
    events:
      - httpApi: "*"
  expire:
    handler: src/handler.expire
    reservedConcurrency: 1
    # Also runs the catalog and asset sweeps (S3 deletes across apps).
    timeout: 300
    events:
      # 03:00 KST daily; a fixed time so operators can predict when channels flip.
      - schedule: cron(0 18 * * ? *)

  siteDeploy:
    handler: src/handler.siteDeploy
    # One deploy at a time (the api serialises per site anyway); holds one
    # MariaDB connection — counted in the budget table (rules/data.md).
    reservedConcurrency: 1
    # Inflates up to 50 MB and PUTs up to 2000 objects.
    memorySize: 512
    timeout: 300
    # Every path ends in a status write; a retry could only repeat a failure.
    maximumRetryAttempts: 0

  gatewayProbe:
    handler: src/handler.gatewayProbe
    reservedConcurrency: 1
    memorySize: 128
    timeout: 20
    events:
      # docs/decisions.md *Realtime gateway* → Monitoring: GET /livez on the
      # self-hosted gateway, SNS on the down/recovered edge only. A 5-minute
      # blind spot is accepted; the alternative was an 11th CloudWatch alarm.
      - schedule:
          rate: rate(5 minutes)
          enabled: ${self:custom.gatewayProbeEnabled.${self:custom.stage}, false}

package:
  individually: true

resources:
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
    HasSiteDistribution:
      !Not [!Equals ["${self:custom.siteDistributionId}", ""]]
    # CloudWatch's free tier is 10 alarms account-wide; see rules/serverless-aws.md.
    IsProd: !Equals ["${self:custom.stage}", "prod"]
  Resources:
    # Private poster bucket; objects are reached only through presigned URLs
    # (visibility is enforced by the API, so CloudFront does not front it).
    # CORS admits the browser PUT from the SPA.
    PosterBucket:
      Type: AWS::S3::Bucket
      # Posters are durable data: never dropped by a stack removal or replacement.
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: yyt-console-posters-${self:custom.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
              BucketKeyEnabled: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        LifecycleConfiguration:
          Rules:
            - Id: abort-incomplete
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              # webUrl defaults to the API host; listing both would duplicate the
              # origin, which CloudFormation's property validation rejects.
              AllowedOrigins:
                - ${param:webUrl, "https://${self:custom.domain}"}
                - http://localhost:5173
              AllowedHeaders: ["content-type", "content-length"]
              MaxAge: 600

    # --- SPA bucket + CloudFront (todo/07) ---------------------------------
    # Static assets are uploaded under the `ui/` prefix by scripts/deploy-web.sh,
    # so CloudFront paths map 1:1 onto object keys.
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: yyt-console-web-${self:custom.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontOAC
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", [!GetAtt WebBucket.Arn, "/ui/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn:
                    !Join [
                      "",
                      [
                        "arn:aws:cloudfront::${aws:accountId}:distribution/",
                        !Ref WebDistribution,
                      ],
                    ]
    WebOac:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:custom.stage}-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    # SPA fallback: extension-less /ui routes are served index.html. A custom
    # error response (403 -> index) would also swallow real S3 403s, so the
    # rewrite happens before the origin is consulted.
    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:custom.stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Redirect / to /ui/; rewrite extension-less /ui routes to /ui/index.html
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var req = event.request;
            var uri = req.uri;
            if (uri === '/') {
              return {
                statusCode: 302,
                statusDescription: 'Found',
                headers: { location: { value: '/ui/' } }
              };
            }
            if (uri === '/ui' || uri === '/ui/') {
              req.uri = '/ui/index.html';
            } else if (uri.indexOf('/ui/') === 0 && uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
              req.uri = '/ui/index.html';
            }
            return req;
          }
    # Response headers for everything the web origin serves (the SPA and the
    # "/" redirect). The CSP is what makes the markdown renderer's sanitizer a
    # second line rather than the only one: no inline or remote scripts, no
    # frames, uploads only to S3 (presigned PUT) and the API on this origin.
    # `style-src 'unsafe-inline'` is required by Mantine's inline style
    # attributes and its CSS-variables <style> element. `img-src` needs the S3
    # host because `GET /events/{id}/poster` answers a 302 to a presigned URL
    # and the browser checks the redirect target against the policy too (the
    # exact virtual-hosted bucket URL the presigner emits, not a wildcard).
    WebHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${self:custom.stage}-web-headers
          SecurityHeadersConfig:
            ContentSecurityPolicy:
              Override: true
              ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://yyt-console-posters-${self:custom.stage}.s3.ap-northeast-2.amazonaws.com; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
            ContentTypeOptions:
              Override: true
            FrameOptions:
              Override: true
              FrameOption: DENY
            ReferrerPolicy:
              Override: true
              ReferrerPolicy: strict-origin-when-cross-origin
            StrictTransportSecurity:
              Override: true
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: false
    # The API behavior gets the transport headers only: no CSP (JSON is never a
    # document), but HSTS and nosniff reach clients that never load the SPA.
    ApiHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${self:custom.stage}-api-headers
          SecurityHeadersConfig:
            ContentTypeOptions:
              Override: true
            StrictTransportSecurity:
              Override: true
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: false
    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.domain}
          Aliases:
            - ${self:custom.domain}
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_200
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.cloudfrontCertArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOac.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: api
              DomainName:
                !Join [
                  "",
                  [!Ref HttpApi, ".execute-api.${aws:region}.amazonaws.com"],
                ]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 30
          # API: no caching, every header except Host (API Gateway needs its own
          # Host), all cookies and query strings forwarded.
          DefaultCacheBehavior:
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: ${self:custom.cachingDisabled}
            OriginRequestPolicyId: ${self:custom.allViewerExceptHost}
            ResponseHeadersPolicyId: !Ref ApiHeadersPolicy
          CacheBehaviors:
            # Exact "/" only: the function answers 302 -> /ui/ at the edge, so
            # the origin is never reached. API paths keep the default behavior.
            - PathPattern: /
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              ResponseHeadersPolicyId: !Ref WebHeadersPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
            - PathPattern: /ui
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              ResponseHeadersPolicyId: !Ref WebHeadersPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
            - PathPattern: /ui/*
              TargetOriginId: web
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: ${self:custom.cachingOptimized}
              ResponseHeadersPolicyId: !Ref WebHeadersPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
    WebDnsA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneName: yyt.life.
        Name: ${self:custom.domain}
        Type: A
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone id
    WebDnsAAAA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneName: yyt.life.
        Name: ${self:custom.domain}
        Type: AAAA
        AliasTarget:
          DNSName: !GetAtt WebDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
    ApiErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    ExpireErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-expire-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-expire
        Statistic: Sum
        Period: 86400
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionId:
      Value: !Ref WebDistribution
