# match.yyt.life — FIFO party matchmaker (API Gateway WebSocket), plus the
# deferred mode's ticket API on match-api.yyt.life (HTTP API).
service: yyt-match
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild
  - serverless-domain-manager

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  domainSuffix:
    dev: "-dev"
    prod: ""
  domain: match${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  # API Gateway cannot map an HTTP API and a WebSocket API onto one domain
  # (rules/serverless-aws.md), so the deferred mode's tickets get a host of
  # their own, as topic's two do.
  apiDomain: match-api${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  ssm: /yyt-service/${self:custom.stage}/match
  # The stage's pool of Firebase projects, shared with console and state
  # (services/state/serverless.yml). Read at runtime by the deferred mode's
  # push hook; without a leading slash so the IAM resource can append it.
  pushSsm: yyt-service/${self:custom.stage}/push/fcm
  # The debug HTTP API (callback sink, manual tick) only exists when deployed
  # with `--param debugHooks=1`; prod never gets the routes.
  debugEvents:
    "1":
      - httpApi: "*"
    "0": []
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  customDomain:
    http:
      domainName: ${self:custom.apiDomain}
      endpointType: regional
      certificateName: yyt.life
      createRoute53Record: true
      autoDomain: true
    websocket:
      domainName: ${self:custom.domain}
      endpointType: regional
      certificateName: yyt.life
      createRoute53Record: true
      autoDomain: true
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  websocketsApiName: ${self:service}-${self:custom.stage}
  # Messages carry `type`; everything still lands on $default (no custom routes).
  websocketsApiRouteSelectionExpression: $request.body.type
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}
    REDIS_HOST: ${ssm:${self:custom.ssm}/redis-host}
    REDIS_PORT: ${ssm:${self:custom.ssm}/redis-port}
    REDIS_USER: ${ssm:${self:custom.ssm}/redis-user}
    REDIS_PASSWORD: ${ssm:${self:custom.ssm}/redis-password}
    REDIS_KEY_PREFIX: ${ssm:${self:custom.ssm}/redis-key-prefix}
    # Management API endpoint; connections are posted to via execute-api, not the custom domain.
    WS_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:custom.stage}"
    WORKER_FUNCTION: ${self:service}-${self:custom.stage}-worker
    DEBUG_HOOKS: ${param:debugHooks, "0"}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${self:custom.stage}/*"
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:custom.stage}-worker"
        # The push pool, exactly as the state stack reads it.
        # `GetParametersByPath` is authorized against the path itself, and the
        # parameters under it are what it returns.
        - Effect: Allow
          Action: ssm:GetParametersByPath
          Resource:
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:custom.pushSsm}
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:custom.pushSsm}/*
        # SecureString decryption, only as SSM performs it for those
        # parameters: the service condition keeps the key from being used
        # directly, the encryption context from decrypting any other path.
        - Effect: Allow
          Action: kms:Decrypt
          Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/*
          Condition:
            StringEquals:
              kms:ViaService: ssm.${aws:region}.amazonaws.com
            StringLike:
              kms:EncryptionContext:PARAMETER_ARN: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:custom.pushSsm}/*

# Connection budget (rules/data.md): every container holds one MySQL + one
# Redis connection. ws 6 + authorizer 5 + http 3 + worker 2 + tick 1 +
# debug 1 = 18, cut from 24 on 2026-08-26 to seat the state stack. `http`
# (2026-10-06, the deferred mode's tickets) took its three from `ws` (8 → 6)
# and `authorizer` (6 → 5): the stack's share is unchanged. Cut here rather than in
# auth because nothing pins these to a stated burst the way
# `docs/auth-game-contract.md` pins auth's, and `worker` is the async
# dispatcher, one invocation per formed match rather than one per player.
# A throttle on `ws`/`authorizer` is **not** a Lambda Error and a WebSocket API
# publishes no 5xx metric, so the Throttles alarms below are the only way any
# of this is visible — see the same reasoning in services/topic.
functions:
  authorizer:
    handler: src/handler.authorizer
    reservedConcurrency: 5
  ws:
    handler: src/handler.ws
    reservedConcurrency: 6
    events:
      - websocket:
          route: $connect
          authorizer:
            name: authorizer
            identitySource:
              - route.request.header.Sec-WebSocket-Protocol
      - websocket:
          route: $disconnect
      - websocket:
          route: $default
  # The deferred mode's ticket API. One route for every method, so a CORS
  # preflight reaches the handler too; it wins over `debug`'s catch-all. Every
  # route is a few Redis commands under the channel lock (4 s wait at most)
  # and one MySQL read; callbacks and pushes leave from `worker` and `tick`.
  http:
    handler: src/handler.http
    reservedConcurrency: 3
    events:
      - httpApi:
          method: "*"
          path: /m/{proxy+}
  worker:
    handler: src/handler.worker
    reservedConcurrency: 2
    environment:
      # A path, not a value; only the functions that send carry it.
      PUSH_SSM_PATH: /${self:custom.pushSsm}/
    # Waits up to 6s for the socket, lock wait 4s, then dispatches while
    # remaining time ≥ 12s (one callback = 5s × 2 attempts + posts). Deferred
    # mode: lock wait 4s + channel read 5s, then a claim needs
    # ROUND_BUDGET_MS (23s) left (services/match/test/deferred.test.ts pins it).
    timeout: 45
    # A retry minutes later matches a different queue; the tick is the backstop.
    maximumRetryAttempts: 0
    maximumEventAge: 120
  tick:
    handler: src/handler.tick
    reservedConcurrency: 1
    timeout: 60
    maximumRetryAttempts: 0
    environment:
      PUSH_SSM_PATH: /${self:custom.pushSsm}/
    events:
      - schedule: rate(1 minute)
  debug:
    handler: src/handler.debug
    reservedConcurrency: 1
    environment:
      DEBUG_KEY: ${ssm:/yyt-service/${self:custom.stage}/debug-key, ""}
    events: ${self:custom.debugEvents.${param:debugHooks, "0"}}

package:
  individually: true

resources:
  # Stage throttle of the HTTP API (the ticket routes and, on dev, the debug
  # routes), written as the state stack writes it: `provider.httpApi` cannot
  # carry it in Serverless 4. Every ticket request costs one MySQL SELECT (the
  # auth channel) before anything is decided, and a waiting player polls; the
  # throttle is what keeps a flood off `http`'s three containers. 5 rps /
  # burst 10 by owner decision (2026-10-06).
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
    # CloudWatch's free tier is 10 alarms account-wide; see rules/serverless-aws.md.
    IsProd: !Equals ["${self:custom.stage}", "prod"]
  Resources:
    WsErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-ws-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-ws
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    TickErrorsAlarm:
      Condition: IsProd
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-tick-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-tick
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
