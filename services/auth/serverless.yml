# auth.yyt.life — template for the other stacks (console/topic/match copy this).
service: yyt-auth
frameworkVersion: "4"

# SF4 bundles its own esbuild; we keep serverless-esbuild for `exclude`/ESM banner control.
build:
  esbuild: false

plugins:
  - serverless-esbuild
  - serverless-domain-manager

custom:
  stage: ${opt:stage, "dev"}
  # Optional stage-wide SNS topic for every alarm (scripts/bootstrap-alarms.sh);
  # empty means alarms exist but notify nobody.
  alarmTopic: ${ssm:/yyt-service/${self:custom.stage}/alarm-topic-arn, ""}
  domainSuffix:
    dev: "-dev"
    prod: ""
  domain: auth${self:custom.domainSuffix.${self:custom.stage}}.yyt.life
  # Per-service credentials uploaded by scripts/bootstrap-ssm.sh from local/env/*.env.
  ssm: /yyt-service/${self:custom.stage}/auth
  # Console's dev writer account reaches the function only when the debug hooks are
  # deployed (`--param debugHooks=1`); otherwise the variables are empty.
  debugMysqlUser:
    "1": ${ssm:${self:custom.ssm}/debug-mysql-user, ""}
    "0": ""
  debugMysqlPassword:
    "1": ${ssm:${self:custom.ssm}/debug-mysql-password, ""}
    "0": ""
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    # AWS SDK v3 is already in the runtime; ioredis and the Prisma client (Rust-free, WASM query compiler inlined) are bundled.
    exclude:
      - "@aws-sdk/*"
    banner:
      # ESM bundles lose `require`; ioredis and the mariadb driver are CJS, so the shim is required.
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
  customDomain:
    domainName: ${self:custom.domain}
    apiType: http
    endpointType: regional
    certificateName: yyt.life
    createRoute53Record: true
    autoDomain: true
  # Read by SF4's built-in pruning (serverless-prune-plugin is bundled since v4).
  prune:
    automatic: true
    number: 5

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  deploymentMethod: direct
  httpApi:
    disableDefaultEndpoint: false
    metrics: true
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    PUBLIC_BASE_URL: https://${self:custom.domain}
    MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    MYSQL_USER: ${ssm:${self:custom.ssm}/mysql-user}
    MYSQL_PASSWORD: ${ssm:${self:custom.ssm}/mysql-password}
    REDIS_HOST: ${ssm:${self:custom.ssm}/redis-host}
    REDIS_PORT: ${ssm:${self:custom.ssm}/redis-port}
    REDIS_USER: ${ssm:${self:custom.ssm}/redis-user}
    REDIS_PASSWORD: ${ssm:${self:custom.ssm}/redis-password}
    REDIS_KEY_PREFIX: ${ssm:${self:custom.ssm}/redis-key-prefix}
    DEBUG_HOOKS: ${param:debugHooks, "0"}
    DEBUG_KEY: ${ssm:/yyt-service/${self:custom.stage}/debug-key, ""}
    # dev only: console's writer account for the debug seeding hook (absent on prod → hooks disabled).
    DEBUG_MYSQL_HOST: ${ssm:${self:custom.ssm}/mysql-host}
    DEBUG_MYSQL_PORT: ${ssm:${self:custom.ssm}/mysql-port}
    DEBUG_MYSQL_DATABASE: ${ssm:${self:custom.ssm}/mysql-database}
    DEBUG_MYSQL_USER: ${self:custom.debugMysqlUser.${param:debugHooks, "0"}}
    DEBUG_MYSQL_PASSWORD: ${self:custom.debugMysqlPassword.${param:debugHooks, "0"}}

functions:
  api:
    handler: src/handler.handler
    # Each container holds one MySQL + one Redis connection (two MySQL on dev
    # with debug hooks); the stateful host allows ~60 MySQL connections across
    # all four stacks, so cap containers per stack (rules/data.md).
    reservedConcurrency: 10
    events:
      - httpApi: "*"

package:
  individually: true

resources:
  Conditions:
    HasAlarmTopic: !Not [!Equals ["${self:custom.alarmTopic}", ""]]
  Resources:
    ApiErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-lambda-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${self:custom.stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:custom.stage}-5xx
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value: !Ref HttpApi
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          !If [HasAlarmTopic, ["${self:custom.alarmTopic}"], !Ref AWS::NoValue]
