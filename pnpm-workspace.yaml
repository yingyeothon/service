packages:
  - "packages/*"
  - "services/*"
  - "apps/*"
allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  serverless: false
  ssh2: false
# @yingyeothon/* is our own library; skip pnpm's release-age gate for it.
minimumReleaseAgeExclude:
  - "@yingyeothon/*"
