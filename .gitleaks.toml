# gitleaks config (v8.16 syntax): default rules plus a rule for KEY=value credentials of the kind kept in local/env/*.env.
title = "yyt service"
[extend]
useDefault = true

[[rules]]
id = "yyt-env-credential"
description = "Credential-looking assignment (PASSWORD/SECRET/TOKEN/KEY = long literal on the same line)"
regex = '''(?i)(?:password|secret|token|api[_-]?key|debug[_-]?key)[ \t]*[=:][ \t]*["']?([A-Za-z0-9+/=_\-]{16,})["']?'''
secretGroup = 1
entropy = 3.0
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''(?i)(placeholder|example|changeme|xxx+|\$\{|<[a-z-]+>)''',
  '''[=:][ \t]*[A-Z][A-Za-z]*(Secret|Token|Key|Password)\b''', # TypeScript type annotations
  '''[=:][ \t]*keystoreProperties\[''',                        # Gradle: reads the gitignored key.properties
  '''(?i)token[ \t]*:[ \t]*[a-z][A-Za-z0-9_]*(\?\.|\.)''',     # Dart named arg fed from an identifier (cancelToken: controller?.token)
]

[allowlist]
description = "Lockfile, this config, and the one shared non-secret test fixture value"
paths = ['''pnpm-lock\.yaml$''', '''\.gitleaks\.toml$''']
regexes = [
  '''(0123456789abcdef){1,4}''',
  '''yak1\.ASNFZ4mrze8BI0VniavN7wEjRWeJq83vASNFZ4mrze8''', # the same bytes as an asset bundle key (docs/asset-encryption-vectors.json)
]

# An encrypted asset bundle's key in its text form (docs/asset-encryption.md):
# `yak1.` + 43 base64url characters. Readable by the bundle's team and meant
# to ship inside an app, never inside this repository. The one allowed value
# is the test-vector key (bytes 0123456789abcdef x4) in that form.
[[rules]]
id = "yyt-asset-bundle-key"
description = "Encrypted asset bundle key (yak1.<43 base64url>)"
regex = '''yak1\.[A-Za-z0-9_-]{43}'''
[rules.allowlist]
regexes = ['''yak1\.ASNFZ4mrze8BI0VniavN7wEjRWeJq83vASNFZ4mrze8''']
