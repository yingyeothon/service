name: Gateway release

on:
  push:
    tags: ["gateway/v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: cd gateway && go vet ./... && go test ./...
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#gateway/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          # The source label links the package to this (public) repository so
          # GHCR gives it the repository's visibility on first publish; the org
          # must allow members to create public packages for that to hold.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=yyt realtime WebSocket gateway (lobby/q)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          # `:X.Y.Z` is immutable; `:main` and `:latest` always follow the
          # newest tag (the box pulls `:main`).
          tags: |
            ghcr.io/${{ github.repository_owner }}/yyt-gateway:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/yyt-gateway:main
            ghcr.io/${{ github.repository_owner }}/yyt-gateway:latest
