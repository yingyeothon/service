name: Tracer release

on:
  push:
    tags: ["tracer/v[0-9]*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: tracer/go.mod
          cache-dependency-path: tracer/go.sum
      - run: cd tracer && test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#tracer/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tracer
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          # The source label links the package to this (public) repository so
          # GHCR gives it the repository's visibility on first publish; the org
          # must allow members to create public packages for that to hold.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=yyt debug-data collector (Sentry-envelope ingest, read API)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          # `:X.Y.Z` is immutable; `:main` and `:latest` always follow the
          # newest tag (the box pulls `:main`).
          tags: |
            ghcr.io/${{ github.repository_owner }}/yyt-tracer:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/yyt-tracer:main
            ghcr.io/${{ github.repository_owner }}/yyt-tracer:latest
