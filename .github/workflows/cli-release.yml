name: CLI release

on:
  push:
    tags: ["cli/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: cd cli && go vet ./... && go test ./...
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#cli/v}" >> "$GITHUB_OUTPUT"
      - run: cli/scripts/build-release.sh "$VERSION"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Draft first: `yyt self update` skips drafts, so a release is never
          # visible with half of its assets uploaded.
          gh release create "$GITHUB_REF_NAME" --draft --title "yyt v$VERSION" \
            --generate-notes cli/dist/*.tar.gz cli/dist/*.zip cli/dist/checksums.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false
