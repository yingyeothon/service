name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm coverage
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cli
        run: echo "present=$([ -f cli/go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cli.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - if: steps.cli.outputs.present == 'true'
        run: cd cli && go vet ./... && go test ./... && go build ./...
      - if: steps.cli.outputs.present == 'true'
        run: cli/scripts/build-release.sh 0.0.0-ci
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: cd gateway && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./...
      - run: docker build --build-arg VERSION=0.0.0-ci gateway/
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, repo config)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --source .
