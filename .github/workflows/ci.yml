name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm coverage
  go:
    # The CLI ships for linux/macOS/Windows, so its tests run on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - shell: bash
        run: cd cli && go vet ./... && go test ./... && go build ./...
      - if: runner.os == 'Linux'
        run: cli/scripts/build-release.sh 0.0.0-ci
      # Both hosts: the script must parse under Windows PowerShell 5.1 too.
      - if: runner.os == 'Windows'
        name: Parse install.ps1 (pwsh)
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content -Raw cli/install.ps1)) | Out-Null"
      - if: runner.os == 'Windows'
        name: Parse install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: "[scriptblock]::Create((Get-Content -Raw cli/install.ps1)) | Out-Null"
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: cd gateway && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./...
      - run: docker build --build-arg VERSION=0.0.0-ci gateway/
  tracer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tracer/go.mod
          cache-dependency-path: tracer/go.sum
      - run: cd tracer && test -z "$(gofmt -l .)" && go vet ./... && go vet -tags dev ./... && go test -race ./... && go test -tags dev ./cmd/... && CGO_ENABLED=0 go build ./...
      - run: docker build -t yyt-tracer:ci --build-arg VERSION=0.0.0-ci tracer/ && test "$(docker run --rm yyt-tracer:ci version)" = 0.0.0-ci
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, repo config)
        # The release-asset URL answers 504 at times (2026-11-09); the API path
        # with retries does not, and the checksum file pins what was fetched.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh release download v8.18.4 -R gitleaks/gitleaks --clobber \
              -p gitleaks_8.18.4_linux_x64.tar.gz -p gitleaks_8.18.4_checksums.txt && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 10))
          done
          sha256sum --ignore-missing -c gitleaks_8.18.4_checksums.txt
          tar xzf gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --source .
