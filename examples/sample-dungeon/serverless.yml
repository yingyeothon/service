# Sample instant dungeon on tslib. Copy this directory on contest day; see README.md.
service: yyt-sample-dungeon
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  stage: ${opt:stage, "dev"}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  deploymentMethod: direct
  websocketsApiName: ${self:service}-${self:custom.stage}
  websocketsApiRouteSelectionExpression: $request.body.action
  # Every value comes from the deploy shell (scripts/deploy.sh sources an env
  # file): no SSM, so the stack copies to any AWS account unchanged.
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY}
    JWT_ISSUER: ${env:JWT_ISSUER}
    JWT_AUDIENCE: ${env:JWT_AUDIENCE}
    MATCH_API_KEY: ${env:MATCH_API_KEY}
    REDIS_HOST: ${env:REDIS_HOST}
    REDIS_PORT: ${env:REDIS_PORT, "6379"}
    REDIS_USER: ${env:REDIS_USER, ""}
    REDIS_PASSWORD: ${env:REDIS_PASSWORD}
    REDIS_KEY_PREFIX: ${env:REDIS_KEY_PREFIX}
    WS_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:custom.stage}"
    WS_URL: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:custom.stage}"
    GAME_ACTOR_LAMBDA_NAME: ${self:service}-${self:custom.stage}-actor
    # Optional: terminate sockets in the yyt realtime gateway instead of the
    # WebSocket API above (the `wsUrl` of a console `q` channel; REDIS_* then
    # hold that channel's participant credential and REDIS_KEY_PREFIX its
    # `game:<stage>:<channelId>:`). The ws/authorizer functions stay deployed
    # but idle.
    GATEWAY_WS_URL: ${env:GATEWAY_WS_URL, ""}
    # Optional: server-less rooms via the topic service (POST /match-callback-topic).
    TOPIC_BASE_URL: ${env:TOPIC_BASE_URL, ""}
    TOPIC_API_KEY: ${env:TOPIC_API_KEY, ""}
    MATCH_API_KEY_TOPIC: ${env:MATCH_API_KEY_TOPIC, ""}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${self:custom.stage}/*"
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:custom.stage}-actor"

# reservedConcurrency is a ceiling that refuses work past it (throttles are silent:
# not Lambda Errors), so size it to the flow's peak, never to "small". It costs
# nothing (provisioned concurrency is what bills) and bounds a runaway fan-out in
# your own account. A dungeon start bursts one uncached authorizer + `$connect`
# per member (partySize up to 16), so those two stay above that burst.
functions:
  authorizer:
    handler: src/handler.authorizer
    reservedConcurrency: 20
  ws:
    handler: src/handler.ws
    reservedConcurrency: 20
    events:
      - websocket:
          route: $connect
          authorizer:
            name: authorizer
            identitySource:
              - route.request.header.Sec-WebSocket-Protocol
            # Contract: cache off (docs/auth-game-contract.md).
            resultTtlInSeconds: 0
      - websocket:
          route: $disconnect
      - websocket:
          route: $default
  actor:
    handler: src/handler.actor
    reservedConcurrency: 10
    # Must exceed waiting + running + margin (src/actor.ts).
    timeout: 180
    maximumRetryAttempts: 0
  matchCallback:
    handler: src/handler.matchCallback
    reservedConcurrency: 5
    events:
      - httpApi:
          method: POST
          path: /match-callback
  matchCallbackTopic:
    handler: src/handler.matchCallbackTopic
    reservedConcurrency: 5
    events:
      - httpApi:
          method: POST
          path: /match-callback-topic

package:
  individually: true

resources:
  Outputs:
    CallbackUrl:
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/match-callback"
    WsUrl:
      Value: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${self:custom.stage}"
