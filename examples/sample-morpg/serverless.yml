# Sample MORPG on tslib + the yyt realtime gateway. Copy this directory on contest day; see README.md.
service: yyt-sample-morpg
frameworkVersion: "4"

build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  stage: ${opt:stage, "dev"}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    outputFileExtension: .mjs
    exclude:
      - "@aws-sdk/*"
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ap-northeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 15
  logRetentionInDays: 7
  deploymentMethod: direct
  # Every value comes from the deploy shell (scripts/deploy.sh sources an env
  # file): no SSM, so the stack copies to any AWS account unchanged.
  environment:
    STAGE: ${self:custom.stage}
    NODE_OPTIONS: --enable-source-maps
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY}
    JWT_ISSUER: ${env:JWT_ISSUER}
    JWT_AUDIENCE: ${env:JWT_AUDIENCE}
    REDIS_HOST: ${env:REDIS_HOST}
    REDIS_PORT: ${env:REDIS_PORT, "6379"}
    REDIS_USER: ${env:REDIS_USER, ""}
    REDIS_PASSWORD: ${env:REDIS_PASSWORD}
    REDIS_KEY_PREFIX: ${env:REDIS_KEY_PREFIX}
    GATEWAY_WS_URL: ${env:GATEWAY_WS_URL}
    LOBBY_CHANNEL_ID: ${env:LOBBY_CHANNEL_ID}
    DOC_BASE_URL: ${env:DOC_BASE_URL}
    DOC_API_KEY: ${env:DOC_API_KEY}
    MAP_URL: ${env:MAP_URL}
    GAME_RUNNING_SECONDS: ${env:GAME_RUNNING_SECONDS, ""}
    GAME_ACTOR_LAMBDA_NAME: ${self:service}-${self:custom.stage}-actor
    # readyCall target: the actor PUTs `${CALLBACK_BASE_URL}/dungeon/ready/{gameId}/{secret}`.
    CALLBACK_BASE_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  iam:
    role:
      statements:
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:custom.stage}-actor"

# reservedConcurrency is a ceiling that refuses work past it (throttles are silent:
# not Lambda Errors), so size it to the flow's peak, never to "small". It costs
# nothing (provisioned concurrency is what bills) and bounds a runaway fan-out in
# your own account. `http` serves both `enter` (waits up to 8 s) and the actor's
# `ready` callback from one pool: keep it well above the parties entering at once.
functions:
  http:
    handler: src/handler.http
    reservedConcurrency: 20
    # Worst case: roster 3 s + invoke + the 8 s ready poll; the API Gateway cap is 30 s.
    timeout: 25
    events:
      - httpApi:
          method: POST
          path: /dungeon/enter
      - httpApi:
          method: PUT
          path: /dungeon/ready/{gameId}/{secret}
      - httpApi:
          method: GET
          path: /character
  actor:
    handler: src/handler.actor
    reservedConcurrency: 10
    # Must exceed waiting + running + margin (src/actor.ts); 900 s is the Lambda ceiling.
    timeout: 900
    maximumRetryAttempts: 0

package:
  individually: true

resources:
  Outputs:
    ApiUrl:
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
