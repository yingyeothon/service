<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#14151a" />
    <title>sample-morpg</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #14151a;
        --panel: #1d1f26;
        --fg: #d7d9e0;
        --dim: #7c8090;
        --accent: #f2c94c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        touch-action: manipulation; /* no double-tap zoom on the map; pinch still works */
        -webkit-touch-callout: none;
      }
      html,
      body {
        height: 100%;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        grid-template-columns: 1fr 34ch;
        grid-template-areas: "head head" "map side" "log side" "input side";
        gap: 6px;
        padding: 6px;
        padding-left: max(6px, env(safe-area-inset-left));
        padding-right: max(6px, env(safe-area-inset-right));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }
      header {
        grid-area: head;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      input {
        font: inherit;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid #333;
        padding: 2px 6px;
      }
      button {
        font: inherit;
        background: var(--accent);
        color: #000;
        border: 0;
        padding: 3px 10px;
        cursor: pointer;
        touch-action: manipulation;
      }
      button.alt,
      #pad button {
        background: #2b2e3a;
        color: var(--fg);
      }
      #title {
        font-weight: bold;
      }
      #status {
        color: var(--dim);
        margin-left: auto;
      }
      [hidden] {
        display: none !important;
      }
      /* The gate (`main.ts`): a black sheet over the page until a session runs; sign-in or connect controls in the middle. */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #gate h1 {
        font-size: 18px;
        margin: 0;
      }
      #gate .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #gate button {
        padding: 10px 18px;
        font-size: 15px;
      }
      #gateStatus {
        color: var(--dim);
        min-height: 1.4em;
      }
      #gateStatus.bad {
        color: #ff6b6b;
      }
      #map {
        grid-area: map;
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        min-height: 200px;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #side {
        grid-area: side;
        background: var(--panel);
        padding: 6px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #log {
        grid-area: log;
        background: var(--panel);
        padding: 6px;
        height: 11em;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      /* The command line: a hint while idle; a real text field while a line is open (it is what raises the phone keyboard). */
      #input {
        grid-area: input;
        background: var(--panel);
        padding: 4px 6px;
        overflow: hidden;
        cursor: text;
      }
      #hint {
        color: var(--dim);
        white-space: pre;
      }
      #cmd {
        width: 100%;
        border: 0;
        padding: 0;
        background: transparent;
        outline: none;
      }
      /* Touch controls (`main.ts`: coarse pointers, while a session runs): the joystick left, action keys right. */
      #pad {
        grid-area: pad;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 8px;
        gap: 8px;
      }
      #pad button {
        min-width: 44px;
        min-height: 44px;
        font-size: 16px;
        opacity: 0.85;
        user-select: none;
        -webkit-user-select: none;
      }
      #stick {
        position: relative;
        width: 120px;
        height: 120px;
        flex: none;
        border-radius: 50%;
        background: #2b2e3a;
        opacity: 0.85;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #knob {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--accent);
        pointer-events: none;
      }
      #pad .keys {
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 4px;
      }
      .k-sys,
      .k-dim {
        color: var(--dim);
      }
      .k-chat {
        color: #e6e6e6;
      }
      .k-party {
        color: #7ed07e;
      }
      .k-whisper {
        color: #d08ae6;
      }
      .k-event {
        color: var(--accent);
      }
      .k-error {
        color: #ff6b6b;
        font-weight: bold;
      }
      .k-title {
        font-weight: bold;
      }
      /* Phones (portrait or landscape): one column, the map first at full width, the pad and panels under it. */
      @media (max-width: 720px), (max-height: 500px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(160px, 1fr) auto auto auto auto;
          grid-template-areas: "head" "map" "pad" "input" "log" "side";
          gap: 4px;
          padding: 4px;
          font-size: 12px;
        }
        #side {
          max-height: 30dvh;
        }
        #log {
          height: auto;
          max-height: 7em;
        }
        #map {
          min-height: 160px;
        }
      }
      /* Wide screens with a coarse pointer (tablets): the pad under the map inside the left column. */
      @media (min-width: 721px) and (min-height: 501px) {
        body {
          grid-template-rows: auto 1fr auto auto auto;
          grid-template-areas:
            "head head"
            "map side"
            "pad side"
            "log side"
            "input side";
        }
      }
    </style>
  </head>
  <body>
    <div id="gate">
      <h1>sample-morpg</h1>
      <div id="gateStatus" role="status" aria-live="polite">
        loading config…
      </div>
      <div class="row" id="gateForm" hidden>
        <label>name <input id="user" size="12" autocomplete="off" /></label>
        <label id="tokenLabel" hidden
          >token <input id="token" size="24" type="password" autocomplete="off"
        /></label>
        <button id="connect" hidden>connect</button>
        <span id="login"></span>
      </div>
    </div>
    <header>
      <span id="title">sample-morpg</span>
      <button id="fullscreen" class="alt" hidden title="toggle fullscreen">
        ⛶
      </button>
      <span id="status" role="status" aria-live="polite"></span>
    </header>
    <div id="map"><canvas id="canvas" width="320" height="160"></canvas></div>
    <div id="pad" hidden>
      <div id="stick" role="img" aria-label="joystick">
        <div id="knob"></div>
      </div>
      <div class="keys">
        <button data-key="f">f</button>
        <button data-key="q">q</button>
        <button data-key="tab">tab</button>
        <button data-key="i">i</button>
        <button data-key="t">t</button>
        <button data-key="p">p</button>
        <button data-key="/">/</button>
        <button data-key="?">?</button>
        <button data-key="escape">esc</button>
      </div>
    </div>
    <div id="side"></div>
    <div id="log"></div>
    <div id="input">
      <div id="hint"></div>
      <input
        id="cmd"
        hidden
        aria-label="command"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="send"
      />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
