<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f1014" />
    <title>sample-morpg</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1014;
        --panel: rgba(22, 24, 32, 0.92);
        --panel-2: rgba(40, 43, 56, 0.9);
        --edge: rgba(255, 255, 255, 0.08);
        --fg: #e6e7ec;
        --dim: #8b90a3;
        --accent: #f2c94c;
        --accent-2: #c99a1f;
        --good: #7ed07e;
        --bad: #ff6b6b;
        --info: #6cc7e6;
        --radius: 12px;
        --top: 52px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.35 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        touch-action: manipulation; /* no double-tap zoom; pinch still works */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        color: var(--fg);
        background: var(--panel-2);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      button.primary {
        background: var(--accent);
        color: #14120a;
        border-color: var(--accent-2);
        font-weight: 600;
      }
      button:disabled,
      button.off {
        opacity: 0.4;
        cursor: default;
      }
      .toast .buttons button,
      #console button,
      #sheet .close {
        min-height: 44px;
        min-width: 44px;
      }
      /* The gate (`main.ts`): a sheet over the page until a session runs. */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: radial-gradient(ellipse at 50% 30%, #1d2030 0%, #000 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #gate h1 {
        font-size: 22px;
        letter-spacing: 0.08em;
        margin: 0;
        color: var(--accent);
      }
      #gate .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #gate input {
        font: inherit;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 10px;
      }
      #gate button {
        padding: 10px 18px;
        font-size: 15px;
        background: var(--accent);
        color: #14120a;
        border-color: var(--accent-2);
        font-weight: 600;
      }
      #gateStatus {
        color: var(--dim);
        min-height: 1.4em;
      }
      #gateStatus.bad {
        color: var(--bad);
      }
      /* The stage: the map fills the screen, every HUD layer floats over it. */
      #stage {
        position: fixed;
        inset: 0;
      }
      #map {
        position: absolute;
        inset: calc(var(--top) + var(--sat)) var(--sar) var(--sab) var(--sal);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #0a0b0e;
      }
      /* The canvas is drawn at an integer scale (`canvas.ts`) and stretched to the map box here, so a phone sees the whole map large. */
      canvas#canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #topbar {
        position: absolute;
        top: var(--sat);
        left: var(--sal);
        right: var(--sar);
        height: var(--top);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.85),
          rgba(0, 0, 0, 0.55)
        );
        border-bottom: 1px solid var(--edge);
      }
      #topbar .status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }
      #place {
        font-weight: 600;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #hp {
        position: relative;
        width: 140px;
        height: 16px;
        background: #2a0d0d;
        border: 1px solid #5a2323;
        border-radius: 8px;
        overflow: hidden;
        flex: none;
      }
      #hp .fill {
        position: absolute;
        inset: 0;
        width: 100%;
        background: linear-gradient(to bottom, #8ee08e, #3f9f3f);
        transition: width 150ms linear;
      }
      #hp .fill.low {
        background: linear-gradient(to bottom, #ff8a8a, #b83333);
      }
      #hp span {
        position: absolute;
        inset: 0;
        font-size: 11px;
        line-height: 14px;
        text-align: center;
        text-shadow: 0 1px 1px #000;
      }
      #level {
        color: var(--accent);
        white-space: nowrap;
      }
      #target {
        color: var(--bad);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status {
        color: var(--dim);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 30vw;
      }
      #icons {
        display: flex;
        gap: 6px;
        flex: none;
      }
      button.hud {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 2px 6px;
        gap: 0;
        line-height: 1.1;
      }
      button.hud .glyph {
        font-size: 18px;
      }
      button.hud .label {
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      button.hud .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        background: var(--bad);
        color: #fff;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        padding: 0 4px;
      }
      /* Bottom controls: joystick left, actions right. */
      #stick {
        position: absolute;
        left: calc(var(--sal) + 18px);
        bottom: calc(var(--sab) + 18px);
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: rgba(40, 43, 56, 0.55);
        border: 2px solid var(--edge);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stick.idle {
        opacity: 0.35;
      }
      #knob {
        position: absolute;
        left: 37px;
        top: 37px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #ffe28a,
          var(--accent-2)
        );
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      @media (pointer: fine) {
        #stick {
          display: none;
        }
      }
      #actions {
        position: absolute;
        right: calc(var(--sar) + 14px);
        bottom: calc(var(--sab) + 14px);
        display: grid;
        grid-template-columns: repeat(2, auto);
        grid-auto-flow: dense;
        gap: 8px;
        align-items: end;
        justify-items: end;
      }
      #actions button.hud {
        min-width: 56px;
        min-height: 56px;
        border-radius: 50%;
        background: rgba(40, 43, 56, 0.8);
      }
      #actions button.primary,
      #actions button.hud.primary {
        grid-column: 2;
        grid-row: 1 / span 2;
        width: 84px;
        height: 84px;
        font-size: 16px;
        background: radial-gradient(
          circle at 35% 30%,
          #ffe28a,
          var(--accent-2)
        );
        color: #14120a;
        border-color: var(--accent-2);
      }
      #actions button.hud.primary .label {
        color: #14120a;
        font-size: 13px;
        font-weight: 700;
      }
      #actions button.hud.reject {
        background: rgba(120, 30, 30, 0.85);
      }
      /* Toasts: top centre. */
      #toasts {
        position: absolute;
        top: calc(var(--top) + var(--sat) + 8px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: min(92vw, 420px);
        max-height: calc(100% - var(--top) - var(--sat) - 220px);
        overflow: hidden;
        pointer-events: none;
        z-index: 40;
      }
      .toast.line {
        pointer-events: none; /* a passing line never blocks the map */
      }
      .toast {
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        padding: 8px 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        animation: drop 160ms ease-out;
      }
      .toast.line {
        padding: 6px 10px;
        font-size: 13px;
      }
      .toast .title {
        font-weight: 700;
        color: var(--accent);
      }
      .toast .line {
        color: var(--dim);
        font-size: 13px;
      }
      .toast .buttons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        justify-content: flex-end;
      }
      .toast.result {
        border-color: var(--accent-2);
      }
      .toast.pending {
        border-color: var(--info);
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* The popup sheet: a menu, a talk, the bag... */
      #sheet {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(94vw, 460px);
        max-height: min(80vh, 640px);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--accent-2);
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        animation: pop 140ms ease-out;
        z-index: 20;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }
      #sheet .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--edge);
      }
      #sheet .head .titles {
        flex: 1;
        min-width: 0;
      }
      #sheet h2 {
        margin: 0;
        font-size: 17px;
        text-transform: capitalize;
      }
      #sheet .sub {
        color: var(--dim);
        font-size: 12px;
      }
      #sheet .close {
        min-width: 40px;
        min-height: 40px;
        border-radius: 50%;
      }
      #sheet .content {
        overflow: auto;
        padding: 8px;
      }
      .portrait {
        width: 48px;
        height: 48px;
        flex: none;
        object-fit: contain;
        image-rendering: pixelated;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
      }
      .portrait.mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: var(--good);
        font-size: 20px;
      }
      .row .portrait {
        width: 36px;
        height: 36px;
      }
      #sheet .rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #sheet .row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        min-height: 52px;
        background: var(--panel-2);
      }
      #sheet .row:not(:disabled):active {
        background: #3a3e50;
      }
      #sheet .row .body {
        flex: 1;
        min-width: 0;
      }
      #sheet .row .t {
        font-weight: 600;
      }
      #sheet .row .s,
      .quest .s,
      .member .s {
        color: var(--dim);
        font-size: 12px;
      }
      .b {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--dim);
        white-space: nowrap;
      }
      .b.q-new,
      .b.q-repeatable {
        background: rgba(242, 201, 76, 0.18);
        color: var(--accent);
      }
      .b.q-active {
        background: rgba(108, 199, 230, 0.18);
        color: var(--info);
      }
      .b.q-ready {
        background: rgba(126, 208, 126, 0.2);
        color: var(--good);
      }
      .b.off {
        color: var(--bad);
      }
      #sheet .row .v {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      #sheet .row .v.off {
        color: var(--dim);
        font-weight: 400;
        text-transform: none;
      }
      #sheet .stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        padding: 6px 8px 10px;
      }
      #sheet .stats .k {
        color: var(--dim);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.05em;
        align-self: center;
      }
      #sheet .quests .h,
      #sheet .members + .rows {
        margin-top: 6px;
      }
      #sheet .quests .h {
        color: var(--dim);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.05em;
        padding: 6px 8px 2px;
      }
      .quest,
      .member {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--edge);
      }
      .quest .t,
      .member .t {
        flex: 1;
        font-weight: 600;
      }
      #sheet .line {
        padding: 2px 8px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #sheet .wide {
        width: 100%;
        margin: 6px 0 10px;
        padding: 10px;
      }
      /* The menu (web-only): fullscreen, debug view, help, quit. */
      #menu {
        position: absolute;
        top: calc(var(--top) + var(--sat) + 6px);
        right: calc(var(--sar) + 8px);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        z-index: 30;
      }
      #menu button {
        text-align: left;
        min-height: 44px;
      }
      /* The console: the command line while it is open. */
      #console {
        position: absolute;
        left: 50%;
        bottom: calc(var(--sab) + 12px);
        transform: translateX(-50%);
        width: min(94vw, 520px);
        display: flex;
        gap: 6px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        z-index: 25;
      }
      #cmd {
        flex: 1;
        min-width: 0;
        font: inherit;
        background: rgba(0, 0, 0, 0.35);
        color: var(--fg);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
      }
      /* The debug view: the terminal's panels, monospace, behind the menu toggle. */
      #debug {
        position: absolute;
        top: calc(var(--top) + var(--sat));
        left: var(--sal);
        bottom: var(--sab);
        width: min(46vw, 360px);
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 4px;
        background: rgba(0, 0, 0, 0.8);
        border-right: 1px solid var(--edge);
        font:
          12px/1.35 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        z-index: 15;
      }
      /* With the debug view open the map moves aside instead of hiding under it. */
      #stage.debug #map {
        left: calc(var(--sal) + min(46vw, 360px));
      }
      #side,
      #log {
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        padding: 4px;
      }
      #side {
        flex: 1;
      }
      #log {
        height: 40%;
        border-top: 1px solid var(--edge);
      }
      #hint {
        color: var(--dim);
        white-space: pre-wrap;
        padding: 2px 4px;
      }
      .k-sys,
      .k-dim {
        color: var(--dim);
      }
      .k-chat {
        color: #e6e6e6;
      }
      .k-party {
        color: var(--good);
      }
      .k-whisper {
        color: #d08ae6;
      }
      .k-event {
        color: var(--accent);
      }
      .k-error {
        color: var(--bad);
        font-weight: bold;
      }
      .k-title {
        font-weight: bold;
      }
      @media (pointer: coarse) {
        #debug {
          bottom: calc(var(--sab) + 160px); /* room for the joystick */
        }
      }
      @media (max-width: 600px) {
        :root {
          --top: 100px; /* the status row and the icon row */
        }
        #topbar {
          flex-wrap: wrap;
          align-content: center;
          row-gap: 4px;
        }
        #topbar .status {
          flex-basis: 100%;
        }
        #icons {
          flex-basis: 100%;
          justify-content: space-between;
        }
        #debug {
          width: 100vw;
          bottom: 45%;
        }
        #stage.debug #map {
          left: var(--sal);
          top: 55%;
        }
        #hp {
          width: 96px;
        }
        button.hud .label {
          display: none;
        }
        #actions button.hud.primary .label {
          display: inline;
        }
        #status {
          display: none;
        }
      }
      @media (max-height: 460px) {
        #actions {
          bottom: calc(var(--sab) + 6px);
        }
        #stick {
          width: 104px;
          height: 104px;
          bottom: calc(var(--sab) + 8px);
        }
        #knob {
          left: 25px;
          top: 25px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .toast,
        #sheet {
          animation: none;
        }
        #hp .fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="gate">
      <h1 id="title">sample-morpg</h1>
      <div id="gateStatus" role="status" aria-live="polite">
        loading config…
      </div>
      <div class="row" id="gateForm" hidden>
        <label>name <input id="user" size="12" autocomplete="off" /></label>
        <label id="tokenLabel" hidden
          >token <input id="token" size="24" type="password" autocomplete="off"
        /></label>
        <button id="connect" hidden>connect</button>
        <span id="login"></span>
      </div>
    </div>
    <div id="stage">
      <div id="map"><canvas id="canvas" width="320" height="160"></canvas></div>
      <div id="topbar">
        <div class="status" id="topStatus"></div>
        <span id="status" role="status" aria-live="polite"></span>
        <div id="icons"></div>
      </div>
      <div id="toasts"></div>
      <div id="stick" role="img" aria-label="joystick" hidden>
        <div id="knob"></div>
      </div>
      <div id="actions"></div>
      <div id="console" hidden>
        <input
          id="cmd"
          aria-label="command"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="send"
        />
        <button id="send" class="primary" type="button">send</button>
        <button id="cancel" type="button" aria-label="close">✕</button>
      </div>
      <div
        id="sheet"
        role="dialog"
        aria-modal="true"
        data-testid="dialog"
        hidden
      ></div>
      <div id="menu" hidden>
        <button id="fullscreen" type="button" hidden>⛶ fullscreen</button>
        <button id="debugToggle" data-testid="btn-debug" type="button">
          🐞 debug view
        </button>
        <button id="command" data-testid="btn-command" type="button">
          / command
        </button>
        <button id="help" data-testid="btn-help" type="button">? help</button>
        <button id="quit" data-testid="btn-quit" type="button">⏏ quit</button>
      </div>
      <div id="debug" hidden>
        <div id="side"></div>
        <div id="log"></div>
        <div id="hint"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
